<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>雙人 AR 反應速度遊戲</title>
    <style>
        :root {
            --bg-color: #0b0f19;          
            --primary-color: #00f3ff;     
            --success-color: #00ffcc;     
            --danger-color: #ff0055;      
            --warning-color: #ffaa00;     
            --text-color: #ffffff;        
            --hud-bg: rgba(11, 15, 25, 0.4); 
            --border-glow: rgba(0, 243, 255, 0.2); 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        #rotate-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(11, 15, 25, 0.95);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #rotate-warning .icon {
            font-size: 48px;
            margin-bottom: 20px;
            animation: rotatePhone 2s infinite ease-in-out;
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        @media screen and (orientation: portrait) {
            #rotate-warning {
                display: flex;
            }
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #webcam-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            transform: scaleX(-1);
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: flex;
            flex-direction: row;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        .player-zone {
            width: 45%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 20px;
            position: relative;
            border: 2px dashed var(--border-glow);
        }

        #zone-p1 { border-right: none; }
        #zone-p2 { border-left: none; }

        .center-hud {
            width: 10%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--hud-bg);
            backdrop-filter: blur(4px);
            border-left: 1px solid var(--border-glow);
            border-right: 1px solid var(--border-glow);
        }

        .player-header {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            margin-bottom: 10px;
        }

        .player-score {
            font-size: 3rem;
            font-weight: 900;
            color: var(--text-color);
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
            margin-bottom: 15px;
        }

        .player-status-msg {
            background: rgba(255, 77, 77, 0.8);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.5);
            display: none;
        }

        #command-display {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--primary-color);
            text-shadow: 0 0 20px var(--primary-color);
            text-align: center;
            line-height: 1.4;
        }

        #overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: rgba(11, 15, 25, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .game-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--primary-color);
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), #0066ff);
            color: var(--text-color);
            border: none;
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }
        
        .btn-primary:disabled {
            background: #2a3b4c;
            color: #ff8080;
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div id="rotate-warning">
        <div class="icon">📱</div>
        <h2>請將手機轉為橫向</h2>
        <p>本遊戲需使用橫向畫面進行雙人 AR 互動</p>
    </div>

    <div id="game-container">
        <video id="webcam-video" autoplay playsinline muted></video>
        <canvas id="game-canvas"></canvas>

        <div id="ui-layer">
            <div class="player-zone" id="zone-p1">
                <div class="player-header">PLAYER 1</div>
                <div class="player-score" id="score-p1">0</div>
                <div class="player-status-msg" id="msg-p1">請完整入鏡</div>
            </div>

            <div class="center-hud">
                <div id="command-display">等待雙人入鏡</div>
            </div>

            <div class="player-zone" id="zone-p2">
                <div class="player-header">PLAYER 2</div>
                <div class="player-score" id="score-p2">0</div>
                <div class="player-status-msg" id="msg-p2">請完整入鏡</div>
            </div>
        </div>

        <div id="overlay-screen" class="interactive">
            <h1 class="game-title">雙人 AR 反應速度遊戲</h1>
            <button class="btn-primary" id="start-btn" disabled>正在初始化模組...</button>
        </div>
    </div>

    <script type="module">
        import { PoseLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/vision_bundle.mjs";

        const CONFIG = {
            timing: {
                countdownDelay: 1500, 
                roundEndDelay: 2000   
            },
            detection: {
                splitScreenX: 0.5,           
                centerDeadZone: 0.08,        
                neutralCrouchMax: 0.70,      
                visibilityThreshold: 0.4,    
                squatKneeAngleMax: 145,      
                squatMinHipDropRatio: 0.04,  
                maxTorsoLeanAngle: 45,       
                squatHistoryFrames: 8,       
                actionConfirmFrames: 3,      
                handDownTolerance: 0.03,     
                handRaiseMinDelta: 0.05      
            },
            commands: [
                { 
                    text: "舉左手", 
                    check: (l) => {
                        const t = CONFIG.detection.visibilityThreshold;
                        const delta = CONFIG.detection.handRaiseMinDelta;
                        if ((l[15].visibility ?? 0) < t || (l[11].visibility ?? 0) < t) return false;
                        return l[15].y < l[11].y - delta; 
                    } 
                },
                { 
                    text: "舉右手", 
                    check: (l) => {
                        const t = CONFIG.detection.visibilityThreshold;
                        const delta = CONFIG.detection.handRaiseMinDelta;
                        if ((l[16].visibility ?? 0) < t || (l[12].visibility ?? 0) < t) return false;
                        return l[16].y < l[12].y - delta; 
                    } 
                },
                { 
                    text: "蹲下",   
                    check: (l, playerKey = 'p1') => {
                        const t = CONFIG.detection.visibilityThreshold;
                        if ((l[23].visibility ?? 0) < t || (l[24].visibility ?? 0) < t || 
                            (l[25].visibility ?? 0) < t || (l[26].visibility ?? 0) < t ||
                            (l[11].visibility ?? 0) < t || (l[12].visibility ?? 0) < t) return false;

                        const dist = (p1, p2) => Math.hypot(p1.x - p2.x, p1.y - p2.y);

                        const shoulder = { x: (l[11].x + l[12].x) / 2, y: (l[11].y + l[12].y) / 2 };
                        const hip = { x: (l[23].x + l[24].x) / 2, y: (l[23].y + l[24].y) / 2 };
                        const knee = { x: (l[25].x + l[26].x) / 2, y: (l[25].y + l[26].y) / 2 };
                        const ankle = { x: (l[27].x + l[28].x) / 2, y: (l[27].y + l[28].y) / 2 };

                        const torsoLen = dist(shoulder, hip);
                        const thighLen = dist(hip, knee);
                        const shinLen = dist(knee, ankle);
                        const bodyScale = torsoLen + thighLen + shinLen;

                        if (bodyScale <= 0) return false;

                        if (!playerState[playerKey] || !playerState[playerKey].baseline.isInitialized) return false;
                        const baseline = playerState[playerKey].baseline;
                        if (baseline.hipY === 0) return false;

                        const hipDrop = hip.y - baseline.hipY; 
                        const hipDropRatio = hipDrop / bodyScale;
                        const hipDropped = hipDropRatio > CONFIG.detection.squatMinHipDropRatio;

                        const getAngle = (a, b, c) => {
                            const ab = { x: a.x - b.x, y: a.y - b.y };
                            const cb = { x: c.x - b.x, y: c.y - b.y };
                            const dot = ab.x * cb.x + ab.y * cb.y;
                            const magAB = Math.hypot(ab.x, ab.y);
                            const magCB = Math.hypot(cb.x, cb.y);
                            if (magAB === 0 || magCB === 0) return 180;
                            let rad = Math.acos(Math.max(-1, Math.min(1, dot / (magAB * magCB))));
                            return rad * (180 / Math.PI);
                        };

                        const leftKneeAngle = getAngle(l[23], l[25], l[27]);
                        const rightKneeAngle = getAngle(l[24], l[26], l[28]);
                        const avgKneeAngle = (leftKneeAngle + rightKneeAngle) / 2;
                        const kneeBent = avgKneeAngle < CONFIG.detection.squatKneeAngleMax;

                        const history = playerState[playerKey].squatHistory;
                        history.push(hip.y);
                        if (history.length > CONFIG.detection.squatHistoryFrames) history.shift();

                        let hasDescendedFromHistory = false;
                        if (history.length >= 4) {
                            let increasingCount = 0;
                            for (let i = 1; i < history.length; i++) {
                                if (history[i] > history[i - 1]) {
                                    increasingCount++;
                                }
                            }
                            const overallDrop = history[history.length - 1] - history[0];
                            hasDescendedFromHistory = (overallDrop > bodyScale * 0.02) && (increasingCount <= history.length / 2);
                        }

                        return hipDropped && kneeBent && hasDescendedFromHistory;
                    } 
                }
            ],
            
            neutralCheck: function(l) {
                const t = CONFIG.detection.visibilityThreshold; 
                const tolerance = CONFIG.detection.handDownTolerance;
                
                // [FIX-NEUTRAL-RELAX] 放寬 neutralCheck 的限制，僅檢測肩膀與髖部是否在畫面中（手腕 visibility 可能因角度被衣袖遮蔽或偵測不穩，故不強求手腕 visibility）
                const isVisible = (l[11].visibility ?? 0) > t && (l[12].visibility ?? 0) > t && 
                                  (l[23].visibility ?? 0) > t && (l[24].visibility ?? 0) > t;   

                if (!isVisible) return false;

                const notCrouching = (l[23].y + l[24].y) / 2 < CONFIG.detection.neutralCrouchMax; 
                
                // 檢查雙手放下（若手腕有被偵測到才進行高度確認，避免手腕 visibility 略低於 0.4 時卡住無法準備）
                const leftWristVis = l[15].visibility ?? 0;
                const rightWristVis = l[16].visibility ?? 0;
                const leftHandsDown = leftWristVis < t || (l[15].y >= l[11].y - tolerance);
                const rightHandsDown = rightWristVis < t || (l[16].y >= l[12].y - tolerance);

                return notCrouching && leftHandsDown && rightHandsDown;
            },

            isBodyInFrame: function(l) {
                if (!l) return false;
                const t = CONFIG.detection.visibilityThreshold;
                // [FIX-FRAME-RELAX] 修正 isBodyInFrame：只檢查肩膀與髖部 (11, 12, 23, 24)，不強制要求手腕 (15, 16) 必須高信心值入鏡，解決使用者已經全身入鏡卻被提示「請完整入鏡」的問題
                const hasShoulders = (l[11].visibility ?? 0) > t && (l[12].visibility ?? 0) > t;
                const hasHips = (l[23].visibility ?? 0) > t && (l[24].visibility ?? 0) > t;
                return hasShoulders && hasHips;
            }
        };

        const playerState = {
            p1: {
                baseline: { samples: [], hipY: 0, isInitialized: false },
                squatHistory: [],
                actionConfirm: 0
            },
            p2: {
                baseline: { samples: [], hipY: 0, isInitialized: false },
                squatHistory: [],
                actionConfirm: 0
            }
        };

        let poseLandmarker = undefined;
        let webcamRunning = false;
        let lastVideoTime = -1;

        let scoreP1 = 0;
        let scoreP2 = 0;
        let gameState = "IDLE"; 
        let currentCommand = null; 
        let roundScored = false;

        const startBtn = document.getElementById('start-btn');
        const overlayScreen = document.getElementById('overlay-screen');
        const webcamVideo = document.getElementById('webcam-video');
        const canvasElement = document.getElementById('game-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const drawingUtils = new DrawingUtils(canvasCtx);

        const commandDisplay = document.getElementById('command-display');
        const scoreP1El = document.getElementById('score-p1');
        const scoreP2El = document.getElementById('score-p2');
        const msgP1El = document.getElementById('msg-p1');
        const msgP2El = document.getElementById('msg-p2');

        async function preloadModel() {
            try {
                startBtn.innerText = "正在載入 WASM...";
                const visionFilesetResolver = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/wasm"
                );
                startBtn.innerText = "正在載入 AI 模型...";
                poseLandmarker = await PoseLandmarker.createFromOptions(visionFilesetResolver, {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numPoses: 2
                });
                startBtn.disabled = false;
                startBtn.innerText = "開始遊戲";
            } catch (err) {
                startBtn.innerText = "錯誤: " + err.message;
            }
        }

        preloadModel();

        startBtn.addEventListener('click', async () => {
            if (!poseLandmarker) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                webcamVideo.srcObject = stream;
                webcamVideo.addEventListener('loadeddata', () => {
                    webcamRunning = true;
                    overlayScreen.style.opacity = '0';
                    setTimeout(() => overlayScreen.style.display = 'none', 300);
                    requestAnimationFrame(predictWebcam);
                    startNeutralCheckPhase(); 
                });
            } catch (err) {
                alert('無法啟用攝影機');
            }
        });

        function startNeutralCheckPhase() {
            gameState = "WAITING_FOR_NEUTRAL";
            currentCommand = null;
            roundScored = false;
            
            playerState.p1.squatHistory = [];
            playerState.p1.actionConfirm = 0;
            playerState.p2.squatHistory = [];
            playerState.p2.actionConfirm = 0;

            commandDisplay.style.color = "var(--primary-color)";
            commandDisplay.innerText = "請雙手放下\n維持站好";
        }

        function startCountdownPhase() {
            gameState = "COUNTDOWN";
            playerState.p1.squatHistory = [];
            playerState.p1.actionConfirm = 0;
            playerState.p2.squatHistory = [];
            playerState.p2.actionConfirm = 0;
            roundScored = false;

            commandDisplay.style.color = "var(--warning-color)";
            commandDisplay.innerText = "準備...";
            
            setTimeout(() => {
                if (!webcamRunning || gameState !== "COUNTDOWN") return;
                const randomCmd = CONFIG.commands[Math.floor(Math.random() * CONFIG.commands.length)];
                currentCommand = randomCmd;
                gameState = "PLAYING"; 
                commandDisplay.style.color = "var(--danger-color)";
                commandDisplay.innerText = randomCmd.text;
            }, CONFIG.timing.countdownDelay);
        }

        function updatePlayerTracking(poses) {
            let p1Landmarks = null;
            let p2Landmarks = null;

            const center = CONFIG.detection.splitScreenX;
            const dead = CONFIG.detection.centerDeadZone;

            for (const pose of poses) {
                const hipX = (pose[23].x + pose[24].x) / 2;

                if (hipX < center - dead) {
                    if (!p1Landmarks) p1Landmarks = pose;
                } else if (hipX > center + dead) {
                    if (!p2Landmarks) p2Landmarks = pose;
                }
            }

            return { p1Landmarks, p2Landmarks };
        }

        async function predictWebcam() {
            if (canvasElement.width !== webcamVideo.videoWidth || canvasElement.height !== webcamVideo.videoHeight) {
                canvasElement.width = webcamVideo.videoWidth;
                canvasElement.height = webcamVideo.videoHeight;
            }

            let startTimeMs = performance.now();
            if (lastVideoTime !== webcamVideo.currentTime) {
                lastVideoTime = webcamVideo.currentTime;
                const poseResult = poseLandmarker.detectForVideo(webcamVideo, startTimeMs);

                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

                let rawPoses = poseResult.landmarks || [];
                for (const landmarks of rawPoses) {
                    drawingUtils.drawConnectors(landmarks, PoseLandmarker.POSE_CONNECTIONS, { color: '#00F3FF', lineWidth: 3 });
                    drawingUtils.drawLandmarks(landmarks, { color: '#FF0055', radius: 4 });
                }

                const { p1Landmarks, p2Landmarks } = updatePlayerTracking(rawPoses);

                if (!p1Landmarks) {
                    msgP1El.style.display = 'block';
                    msgP1El.innerText = "P1 請入鏡";
                } else if (!CONFIG.isBodyInFrame(p1Landmarks)) {
                    msgP1El.style.display = 'block';
                    msgP1El.innerText = "P1 請完整入鏡";
                } else {
                    msgP1El.style.display = 'none';
                }

                if (!p2Landmarks) {
                    msgP2El.style.display = 'block';
                    msgP2El.innerText = "P2 請入鏡";
                } else if (!CONFIG.isBodyInFrame(p2Landmarks)) {
                    msgP2El.style.display = 'block';
                    msgP2El.innerText = "P2 請完整入鏡";
                } else {
                    msgP2El.style.display = 'none';
                }

                if (gameState === "WAITING_FOR_NEUTRAL") {
                    let p1Ready = false;
                    let p2Ready = false;

                    if (p1Landmarks && CONFIG.isBodyInFrame(p1Landmarks) && CONFIG.neutralCheck(p1Landmarks)) {
                        const hipY1 = (p1Landmarks[23].y + p1Landmarks[24].y) / 2;
                        const b1 = playerState.p1.baseline;
                        if (!b1.isInitialized) {
                            b1.samples.push(hipY1);
                            if (b1.samples.length >= 12) {
                                b1.samples.sort((a, b) => a - b);
                                const mid = Math.floor(b1.samples.length / 2);
                                b1.hipY = b1.samples.length % 2 !== 0 ? b1.samples[mid] : (b1.samples[mid - 1] + b1.samples[mid]) / 2;
                                b1.isInitialized = true;
                            }
                        }
                        p1Ready = b1.isInitialized;
                    }

                    if (p2Landmarks && CONFIG.isBodyInFrame(p2Landmarks) && CONFIG.neutralCheck(p2Landmarks)) {
                        const hipY2 = (p2Landmarks[23].y + p2Landmarks[24].y) / 2;
                        const b2 = playerState.p2.baseline;
                        if (!b2.isInitialized) {
                            b2.samples.push(hipY2);
                            if (b2.samples.length >= 12) {
                                b2.samples.sort((a, b) => a - b);
                                const mid = Math.floor(b2.samples.length / 2);
                                b2.hipY = b2.samples.length % 2 !== 0 ? b2.samples[mid] : (b2.samples[mid - 1] + b2.samples[mid]) / 2;
                                b2.isInitialized = true;
                            }
                        }
                        p2Ready = b2.isInitialized;
                    }

                    const everyoneReady = 
                        p1Landmarks && 
                        p2Landmarks && 
                        CONFIG.isBodyInFrame(p1Landmarks) && 
                        CONFIG.isBodyInFrame(p2Landmarks) && 
                        p1Ready && 
                        p2Ready && 
                        playerState.p1.baseline.isInitialized && 
                        playerState.p2.baseline.isInitialized;

                    if (!p1Landmarks || !p2Landmarks) {
                        commandDisplay.style.color = "var(--primary-color)";
                        commandDisplay.innerText = "等待雙人入鏡";
                    } else if (!p1Ready || !p2Ready) {
                        commandDisplay.style.color = "var(--warning-color)";
                        commandDisplay.innerText = "等待準備完成";
                    }

                    if (everyoneReady) {
                        startCountdownPhase();
                    }
                }

                if (gameState === "PLAYING" && currentCommand && !roundScored) {
                    let p1Success = false;
                    let p2Success = false;

                    if (p1Landmarks) {
                        let matched = currentCommand.text === "蹲下" ? currentCommand.check(p1Landmarks, 'p1') : currentCommand.check(p1Landmarks);
                        if (matched) {
                            playerState.p1.actionConfirm++;
                        } else {
                            playerState.p1.actionConfirm = 0;
                        }
                        if (playerState.p1.actionConfirm >= CONFIG.detection.actionConfirmFrames) {
                            p1Success = true;
                        }
                    } else {
                        playerState.p1.actionConfirm = 0;
                    }

                    if (p2Landmarks) {
                        let matched = currentCommand.text === "蹲下" ? currentCommand.check(p2Landmarks, 'p2') : currentCommand.check(p2Landmarks);
                        if (matched) {
                            playerState.p2.actionConfirm++;
                        } else {
                            playerState.p2.actionConfirm = 0;
                        }
                        if (playerState.p2.actionConfirm >= CONFIG.detection.actionConfirmFrames) {
                            p2Success = true;
                        }
                    } else {
                        playerState.p2.actionConfirm = 0;
                    }

                    if ((p1Success || p2Success) && !roundScored) {
                        roundScored = true;
                        gameState = "ROUND_END";

                        if (p1Success && p2Success) {
                            commandDisplay.style.color = "var(--warning-color)";
                            commandDisplay.innerText = "平手！";
                        } else if (p1Success) {
                            scoreP1++;
                            scoreP1El.innerText = scoreP1;
                            commandDisplay.style.color = "var(--success-color)";
                            commandDisplay.innerText = "P1 得分！";
                        } else if (p2Success) {
                            scoreP2++;
                            scoreP2El.innerText = scoreP2;
                            commandDisplay.style.color = "var(--success-color)";
                            commandDisplay.innerText = "P2 得分！";
                        }
                        setTimeout(startNeutralCheckPhase, CONFIG.timing.roundEndDelay);
                    }
                }

                canvasCtx.restore();
            }

            if (webcamRunning) {
                requestAnimationFrame(predictWebcam);
            }
        }
    </script>
</body>
</html>
