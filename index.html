<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>雙人 AR 反應速度遊戲</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
            color: #ffffff;
        }

        #rotate-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(11, 15, 25, 0.95);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #rotate-warning .icon {
            font-size: 48px;
            margin-bottom: 20px;
            animation: rotatePhone 2s infinite ease-in-out;
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        @media screen and (orientation: portrait) {
            #rotate-warning {
                display: flex;
            }
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #webcam-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            transform: scaleX(-1);
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: flex;
            flex-direction: row;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        .player-zone {
            width: 45%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 20px;
            position: relative;
            border: 2px dashed rgba(0, 243, 255, 0.2);
        }

        #zone-p1 { border-right: none; }
        #zone-p2 { border-left: none; }

        .center-hud {
            width: 10%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(11, 15, 25, 0.4);
            backdrop-filter: blur(4px);
            border-left: 1px solid rgba(0, 243, 255, 0.2);
            border-right: 1px solid rgba(0, 243, 255, 0.2);
        }

        .player-header {
            font-size: 1.2rem;
            font-weight: bold;
            color: #00f3ff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            margin-bottom: 10px;
        }

        .player-score {
            font-size: 3rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
            margin-bottom: 15px;
        }

        .player-status-msg {
            background: rgba(255, 77, 77, 0.8);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.5);
            display: none;
        }

        #command-display {
            font-size: 2rem;
            font-weight: 900;
            color: #00f3ff;
            text-shadow: 0 0 20px #00f3ff;
            text-align: center;
            line-height: 1.4;
        }

        #overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: rgba(11, 15, 25, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .game-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: #00f3ff;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00f3ff, #0066ff);
            color: #ffffff;
            border: none;
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }
        
        .btn-primary:disabled {
            background: #2a3b4c;
            color: #ff8080;
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div id="rotate-warning">
        <div class="icon">📱</div>
        <h2>請將手機轉為橫向</h2>
        <p>本遊戲需使用橫向畫面進行雙人 AR 互動</p>
    </div>

    <div id="game-container">
        <video id="webcam-video" autoplay playsinline muted></video>
        <canvas id="game-canvas"></canvas>

        <div id="ui-layer">
            <div class="player-zone" id="zone-p1">
                <div class="player-header">PLAYER 1</div>
                <div class="player-score" id="score-p1">0</div>
                <div class="player-status-msg" id="msg-p1">請入鏡</div>
            </div>

            <div class="center-hud">
                <div id="command-display">準備</div>
            </div>

            <div class="player-zone" id="zone-p2">
                <div class="player-header">PLAYER 2</div>
                <div class="player-score" id="score-p2">0</div>
                <div class="player-status-msg" id="msg-p2">請入鏡</div>
            </div>
        </div>

        <div id="overlay-screen" class="interactive">
            <h1 class="game-title">雙人 AR 反應速度遊戲</h1>
            <button class="btn-primary" id="start-btn" disabled>正在初始化模組...</button>
        </div>
    </div>

    <script type="module">
        import { PoseLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/vision_bundle.mjs";

        let poseLandmarker = undefined;
        let webcamRunning = false;
        let lastVideoTime = -1;

        let scoreP1 = 0;
        let scoreP2 = 0;
        let gameState = "IDLE"; // IDLE, COUNTDOWN, PLAYING, ROUND_END
        let currentCommand = null;
        let roundTimer = null;

        const commands = [
            { text: "舉左手", check: (l) => l[15].y < l[11].y }, // 左手腕高於左肩膀
            { text: "舉右手", check: (l) => l[16].y < l[12].y }, // 右手腕高於右肩膀
            { text: "蹲下", check: (l) => (l[23].y + l[24].y)/2 > 0.65 } // 髖部位置下降
        ];

        const startBtn = document.getElementById('start-btn');
        const overlayScreen = document.getElementById('overlay-screen');
        const webcamVideo = document.getElementById('webcam-video');
        const canvasElement = document.getElementById('game-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const drawingUtils = new DrawingUtils(canvasCtx);

        const commandDisplay = document.getElementById('command-display');
        const scoreP1El = document.getElementById('score-p1');
        const scoreP2El = document.getElementById('score-p2');

        async function preloadModel() {
            try {
                startBtn.innerText = "正在載入 WASM...";
                const visionFilesetResolver = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/wasm"
                );
                startBtn.innerText = "正在載入 AI 模型...";
                poseLandmarker = await PoseLandmarker.createFromOptions(visionFilesetResolver, {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numPoses: 2
                });
                startBtn.disabled = false;
                startBtn.innerText = "開始遊戲";
            } catch (err) {
                startBtn.innerText = "錯誤: " + err.message;
            }
        }

        preloadModel();

        startBtn.addEventListener('click', async () => {
            if (!poseLandmarker) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                webcamVideo.srcObject = stream;
                webcamVideo.addEventListener('loadeddata', () => {
                    webcamRunning = true;
                    overlayScreen.style.opacity = '0';
                    setTimeout(() => overlayScreen.style.display = 'none', 300);
                    requestAnimationFrame(predictWebcam);
                    startNewRound();
                });
            } catch (err) {
                alert('無法啟用攝影機');
            }
        });

        function startNewRound() {
            if (gameState === "PLAYING") return;
            gameState = "COUNTDOWN";
            currentCommand = null; // 清空當前指令，確保準備期間無法被比對
            commandDisplay.style.color = "#00f3ff";
            commandDisplay.innerText = "準備...";
            
            setTimeout(() => {
                if (!webcamRunning) return;
                const randomCmd = commands[Math.floor(Math.random() * commands.length)];
                currentCommand = randomCmd;
                gameState = "PLAYING"; // 只有在此狀態下才正式開放判定
                commandDisplay.style.color = "#ff0055";
                commandDisplay.innerText = randomCmd.text;
            }, 1500);
        }

        async function predictWebcam() {
            if (canvasElement.width !== webcamVideo.videoWidth || canvasElement.height !== webcamVideo.videoHeight) {
                canvasElement.width = webcamVideo.videoWidth;
                canvasElement.height = webcamVideo.videoHeight;
            }

            let startTimeMs = performance.now();
            if (lastVideoTime !== webcamVideo.currentTime) {
                lastVideoTime = webcamVideo.currentTime;
                const poseResult = poseLandmarker.detectForVideo(webcamVideo, startTimeMs);

                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

                let p1Landmarks = null;
                let p2Landmarks = null;

                if (poseResult.landmarks && poseResult.landmarks.length > 0) {
                    for (const landmarks of poseResult.landmarks) {
                        // 以畫面中線 (x = 0.5) 區分左右玩家
                        const hipX = (landmarks[23].x + landmarks[24].x) / 2;
                        if (hipX > 0.5) {
                            p1Landmarks = landmarks; // 鏡射後左側
                        } else {
                            p2Landmarks = landmarks; // 鏡射後右側
                        }

                        drawingUtils.drawConnectors(landmarks, PoseLandmarker.POSE_CONNECTIONS, { color: '#00F3FF', lineWidth: 3 });
                        drawingUtils.drawLandmarks(landmarks, { color: '#FF0055', radius: 4 });
                    }
                }

                // 遊戲判定邏輯：嚴格檢查 gameState 為 "PLAYING" 且 currentCommand 存在才進行比對
                if (gameState === "PLAYING" && currentCommand) {
                    let p1Success = p1Landmarks ? currentCommand.check(p1Landmarks) : false;
                    let p2Success = p2Landmarks ? currentCommand.check(p2Landmarks) : false;

                    if (p1Success || p2Success) {
                        gameState = "ROUND_END";
                        if (p1Success) {
                            scoreP1++;
                            scoreP1El.innerText = scoreP1;
                            commandDisplay.style.color = "#00ffcc";
                            commandDisplay.innerText = "P1 得分！";
                        } else if (p2Success) {
                            scoreP2++;
                            scoreP2El.innerText = scoreP2;
                            commandDisplay.style.color = "#00ffcc";
                            commandDisplay.innerText = "P2 得分！";
                        }
                        setTimeout(startNewRound, 2000);
                    }
                }

                canvasCtx.restore();
            }

            if (webcamRunning) {
                requestAnimationFrame(predictWebcam);
            }
        }
    </script>
</body>
</html>
