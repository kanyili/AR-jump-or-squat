<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>雙人 AR 反應速度遊戲</title>
    <style>
        :root {
            --bg-color: #0b0f19;          
            --primary-color: #00f3ff;     
            --success-color: #00ffcc;     
            --danger-color: #ff0055;      
            --warning-color: #ffaa00;     
            --text-color: #ffffff;        
            --hud-bg: rgba(11, 15, 25, 0.4); 
            --border-glow: rgba(0, 243, 255, 0.2); 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        #rotate-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(11, 15, 25, 0.95);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #rotate-warning .icon {
            font-size: 48px;
            margin-bottom: 20px;
            animation: rotatePhone 2s infinite ease-in-out;
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        @media screen and (orientation: portrait) {
            #rotate-warning {
                display: flex;
            }
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #webcam-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            transform: scaleX(-1);
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: flex;
            flex-direction: row;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        .player-zone {
            width: 45%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 20px;
            position: relative;
            border: 2px dashed var(--border-glow);
        }

        #zone-p1 { border-right: none; }
        #zone-p2 { border-left: none; }

        .center-hud {
            width: 10%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--hud-bg);
            backdrop-filter: blur(4px);
            border-left: 1px solid var(--border-glow);
            border-right: 1px solid var(--border-glow);
        }

        .player-header {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            margin-bottom: 10px;
        }

        .player-score {
            font-size: 3rem;
            font-weight: 900;
            color: var(--text-color);
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
            margin-bottom: 15px;
        }

        .player-status-msg {
            background: rgba(255, 77, 77, 0.8);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.5);
            display: none;
        }

        #command-display {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--primary-color);
            text-shadow: 0 0 20px var(--primary-color);
            text-align: center;
            line-height: 1.4;
        }

        #overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: rgba(11, 15, 25, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .game-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--primary-color);
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), #0066ff);
            color: var(--text-color);
            border: none;
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }
        
        .btn-primary:disabled {
            background: #2a3b4c;
            color: #ff8080;
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div id="rotate-warning">
        <div class="icon">📱</div>
        <h2>請將手機轉為橫向</h2>
        <p>本遊戲需使用橫向畫面進行雙人 AR 互動</p>
    </div>

    <div id="game-container">
        <video id="webcam-video" autoplay playsinline muted></video>
        <canvas id="game-canvas"></canvas>

        <div id="ui-layer">
            <div class="player-zone" id="zone-p1">
                <div class="player-header">PLAYER 1</div>
                <div class="player-score" id="score-p1">0</div>
                <div class="player-status-msg" id="msg-p1">請完整入鏡</div>
            </div>

            <div class="center-hud">
                <div id="command-display">請站好</div>
            </div>

            <div class="player-zone" id="zone-p2">
                <div class="player-header">PLAYER 2</div>
                <div class="player-score" id="score-p2">0</div>
                <div class="player-status-msg" id="msg-p2">請完整入鏡</div>
            </div>
        </div>

        <div id="overlay-screen" class="interactive">
            <h1 class="game-title">雙人 AR 反應速度遊戲</h1>
            <button class="btn-primary" id="start-btn" disabled>正在初始化模組...</button>
        </div>
    </div>

    <script type="module">
        import { PoseLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/vision_bundle.mjs";

        const CONFIG = {
            timing: {
                countdownDelay: 1500, 
                roundEndDelay: 2000   
            },
            detection: {
                splitScreenX: 0.5,           
                neutralCrouchMax: 0.70,      // 放寬站立時的胸腹高度限制
                visibilityThreshold: 0.15,   // 大幅降低判定門檻，適應各種環境光線
                squatKneeAngleMax: 155,      
                squatHipKneeRatioMax: 0.75,  
                squatMinHipDropRatio: 0.05,  
                maxTorsoLeanAngle: 45,       
                squatHistoryFrames: 8,       
                actionConfirmFrames: 2       // 縮短至連續 2 幀即可確認
            },
            commands: [
                { 
                    text: "舉左手", 
                    check: (l) => {
                        const t = CONFIG.detection.visibilityThreshold;
                        if ((l[15].visibility ?? 0) < t || (l[11].visibility ?? 0) < t) return false;
                        return l[15].y < l[11].y; 
                    } 
                },
                { 
                    text: "舉右手", 
                    check: (l) => {
                        const t = CONFIG.detection.visibilityThreshold;
                        if ((l[16].visibility ?? 0) < t || (l[12].visibility ?? 0) < t) return false;
                        return l[16].y < l[12].y; 
                    } 
                },
                { 
                    text: "蹲下",   
                    check: (l, playerKey = 'p1') => {
                        const t = CONFIG.detection.visibilityThreshold;
                        if ((l[23].visibility ?? 0) < t || (l[24].visibility ?? 0) < t) return false;

                        const dist = (p1, p2) => Math.hypot(p1.x - p2.x, p1.y - p2.y);

                        const shoulder = { x: (l[11].x + l[12].x) / 2, y: (l[11].y + l[12].y) / 2 };
                        const hip = { x: (l[23].x + l[24].x) / 2, y: (l[23].y + l[24].y) / 2 };
                        const knee = { x: (l[25].x + l[26].x) / 2, y: (l[25].y + l[26].y) / 2 };
                        const ankle = { x: (l[27].x + l[28].x) / 2, y: (l[27].y + l[28].y) / 2 };

                        const torsoLen = dist(shoulder, hip);
                        const thighLen = dist(hip, knee);
                        const shinLen = dist(knee, ankle);
                        const bodyScale = torsoLen + thighLen + shinLen;

                        if (bodyScale <= 0) return false;

                        const baseline = playerState[playerKey].baseline;
                        if (!baseline.isInitialized || baseline.hipY === 0) return false;

                        const hipDrop = hip.y - baseline.hipY; 
                        const hipDropRatio = hipDrop / bodyScale;
                        const hasDropped = hipDropRatio > CONFIG.detection.squatMinHipDropRatio;

                        let hasDescendedFromHistory = true;
                        const history = playerState[playerKey].squatHistory;
                        if (history.length >= 3) {
                            const earliestHipY = history[0];
                            const maxDropInHistory = hip.y - earliestHipY;
                            hasDescendedFromHistory = maxDropInHistory > (bodyScale * 0.02);
                        }
                        history.push(hip.y);
                        if (history.length > CONFIG.detection.squatHistoryFrames) history.shift();

                        return hasDropped && hasDescendedFromHistory;
                    } 
                }
            ],
            
            neutralCheck: function(l) {
                // 只要偵測到軀幹與肩膀即可通過站姿確認，不再強制要求所有末端關節高信心值
                const t = CONFIG.detection.visibilityThreshold; 
                const isVisible = (l[11].visibility ?? 0) > t && (l[12].visibility ?? 0) > t && 
                                  (l[23].visibility ?? 0) > t && (l[24].visibility ?? 0) > t;   

                if (!isVisible) return false;

                const notCrouching = (l[23].y + l[24].y) / 2 < CONFIG.detection.neutralCrouchMax; 
                return notCrouching;
            },

            isBodyInFrame: function(l) {
                // 永久回傳 true，避免任何入鏡警告卡住遊戲流程
                return true;
            }
        };

        const playerState = {
            p1: {
                tracking: null,
                baseline: { samples: [], hipY: 0, isInitialized: false },
                squatHistory: [],
                actionConfirm: 0
            },
            p2: {
                tracking: null,
                baseline: { samples: [], hipY: 0, isInitialized: false },
                squatHistory: [],
                actionConfirm: 0
            }
        };

        let poseLandmarker = undefined;
        let webcamRunning = false;
        let lastVideoTime = -1;

        let scoreP1 = 0;
        let scoreP2 = 0;
        let gameState = "IDLE"; 
        let currentCommand = null; 
        let roundScored = false;

        const startBtn = document.getElementById('start-btn');
        const overlayScreen = document.getElementById('overlay-screen');
        const webcamVideo = document.getElementById('webcam-video');
        const canvasElement = document.getElementById('game-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const drawingUtils = new DrawingUtils(canvasCtx);

        const commandDisplay = document.getElementById('command-display');
        const scoreP1El = document.getElementById('score-p1');
        const scoreP2El = document.getElementById('score-p2');
        const msgP1El = document.getElementById('msg-p1');
        const msgP2El = document.getElementById('msg-p2');

        async function preloadModel() {
            try {
                startBtn.innerText = "正在載入 WASM...";
                const visionFilesetResolver = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/wasm"
                );
                startBtn.innerText = "正在載入 AI 模型...";
                poseLandmarker = await PoseLandmarker.createFromOptions(visionFilesetResolver, {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numPoses: 2
                });
                startBtn.disabled = false;
                startBtn.innerText = "開始遊戲";
            } catch (err) {
                startBtn.innerText = "錯誤: " + err.message;
            }
        }

        preloadModel();

        startBtn.addEventListener('click', async () => {
            if (!poseLandmarker) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                webcamVideo.srcObject = stream;
                webcamVideo.addEventListener('loadeddata', () => {
                    webcamRunning = true;
                    overlayScreen.style.opacity = '0';
                    setTimeout(() => overlayScreen.style.display = 'none', 300);
                    requestAnimationFrame(predictWebcam);
                    startNeutralCheckPhase(); 
                });
            } catch (err) {
                alert('無法啟用攝影機');
            }
        });

        function startNeutralCheckPhase() {
            gameState = "WAITING_FOR_NEUTRAL";
            currentCommand = null;
            roundScored = false;
            
            playerState.p1.squatHistory = [];
            playerState.p1.actionConfirm = 0;
            playerState.p1.baseline = { samples: [], hipY: 0, isInitialized: false };

            playerState.p2.squatHistory = [];
            playerState.p2.actionConfirm = 0;
            playerState.p2.baseline = { samples: [], hipY: 0, isInitialized: false };

            commandDisplay.style.color = "var(--primary-color)";
            commandDisplay.innerText = "請雙手放下\n維持站好";
        }

        function startCountdownPhase() {
            gameState = "COUNTDOWN";
            playerState.p1.squatHistory = [];
            playerState.p1.actionConfirm = 0;
            playerState.p2.squatHistory = [];
            playerState.p2.actionConfirm = 0;
            roundScored = false;

            commandDisplay.style.color = "var(--warning-color)";
            commandDisplay.innerText = "準備...";
            
            setTimeout(() => {
                if (!webcamRunning) return;
                const randomCmd = CONFIG.commands[Math.floor(Math.random() * CONFIG.commands.length)];
                currentCommand = randomCmd;
                gameState = "PLAYING"; 
                commandDisplay.style.color = "var(--danger-color)";
                commandDisplay.innerText = randomCmd.text;
            }, CONFIG.timing.countdownDelay);
        }

        function updatePlayerTracking(poses) {
            let p1Current = playerState.p1.tracking;
            let p2Current = playerState.p2.tracking;

            let p1Assigned = null;
            let p2Assigned = null;

            if (poses.length === 0) {
                playerState.p1.tracking = null;
                playerState.p2.tracking = null;
                return { p1Landmarks: null, p2Landmarks: null };
            }

            const getCenter = (l) => ({
                x: (l[23].x + l[24].x + l[11].x + l[12].x) / 4,
                y: (l[23].y + l[24].y + l[11].y + l[12].y) / 4
            });

            if (poses.length === 1) {
                const pose = poses[0];
                const hipX = (pose[23].x + pose[24].x) / 2;
                if (!p1Current && !p2Current) {
                    if (hipX < CONFIG.detection.splitScreenX) p1Assigned = pose;
                    else p2Assigned = pose;
                } else if (p1Current && !p2Current) {
                    const d1 = Math.hypot(getCenter(pose).x - getCenter(p1Current).x, getCenter(pose).y - getCenter(p1Current).y);
                    if (d1 < 0.3) p1Assigned = pose;
                    else {
                        if (hipX < CONFIG.detection.splitScreenX) p1Assigned = pose;
                        else p2Assigned = pose;
                    }
                } else if (!p1Current && p2Current) {
                    const d2 = Math.hypot(getCenter(pose).x - getCenter(p2Current).x, getCenter(pose).y - getCenter(p2Current).y);
                    if (d2 < 0.3) p2Assigned = pose;
                    else {
                        if (hipX < CONFIG.detection.splitScreenX) p1Assigned = pose;
                        else p2Assigned = pose;
                    }
                } else {
                    const d1 = Math.hypot(getCenter(pose).x - getCenter(p1Current).x, getCenter(pose).y - getCenter(p1Current).y);
                    const d2 = Math.hypot(getCenter(pose).x - getCenter(p2Current).x, getCenter(pose).y - getCenter(p2Current).y);
                    if (d1 < d2) p1Assigned = pose;
                    else p2Assigned = pose;
                }
            } else {
                let poseA = poses[0];
                let poseB = poses[1];

                if (p1Current && p2Current) {
                    const d1A = Math.hypot(getCenter(poseA).x - getCenter(p1Current).x, getCenter(poseA).y - getCenter(p1Current).y);
                    const d1B = Math.hypot(getCenter(poseB).x - getCenter(p1Current).x, getCenter(poseB).y - getCenter(p1Current).y);
                    if (d1A < d1B) {
                        p1Assigned = poseA;
                        p2Assigned = poseB;
                    } else {
                        p1Assigned = poseB;
                        p2Assigned = poseA;
                    }
                } else {
                    let leftPose = poseA[23].x < poseB[23].x ? poseA : poseB;
                    let rightPose = poseA[23].x < poseB[23].x ? poseB : poseA;
                    p1Assigned = leftPose;
                    p2Assigned = rightPose;
                }
            }

            playerState.p1.tracking = p1Assigned;
            playerState.p2.tracking = p2Assigned;
            return { p1Landmarks: p1Assigned, p2Landmarks: p2Assigned };
        }

        async function predictWebcam() {
            if (canvasElement.width !== webcamVideo.videoWidth || canvasElement.height !== webcamVideo.videoHeight) {
                canvasElement.width = webcamVideo.videoWidth;
                canvasElement.height = webcamVideo.videoHeight;
            }

            let startTimeMs = performance.now();
            if (lastVideoTime !== webcamVideo.currentTime) {
                lastVideoTime = webcamVideo.currentTime;
                const poseResult = poseLandmarker.detectForVideo(webcamVideo, startTimeMs);

                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

                let rawPoses = poseResult.landmarks || [];
                for (const landmarks of rawPoses) {
                    drawingUtils.drawConnectors(landmarks, PoseLandmarker.POSE_CONNECTIONS, { color: '#00F3FF', lineWidth: 3 });
                    drawingUtils.drawLandmarks(landmarks, { color: '#FF0055', radius: 4 });
                }

                const { p1Landmarks, p2Landmarks } = updatePlayerTracking(rawPoses);

                // 隱藏紅色的入鏡警告，讓畫面保持乾淨並順利執行
                msgP1El.style.display = 'none';
                msgP2El.style.display = 'none';

                if (gameState === "WAITING_FOR_NEUTRAL") {
                    let p1Ready = false;
                    let p2Ready = false;

                    if (p1Landmarks && CONFIG.neutralCheck(p1Landmarks)) {
                        const hipY1 = (p1Landmarks[23].y + p1Landmarks[24].y) / 2;
                        const b1 = playerState.p1.baseline;
                        if (!b1.isInitialized) {
                            b1.samples.push(hipY1);
                            if (b1.samples.length >= 8) {
                                const sum = b1.samples.reduce((a, b) => a + b, 0);
                                b1.hipY = sum / b1.samples.length;
                                b1.isInitialized = true;
                            }
                        }
                        p1Ready = b1.isInitialized;
                    }

                    if (p2Landmarks && CONFIG.neutralCheck(p2Landmarks)) {
                        const hipY2 = (p2Landmarks[23].y + p2Landmarks[24].y) / 2;
                        const b2 = playerState.p2.baseline;
                        if (!b2.isInitialized) {
                            b2.samples.push(hipY2);
                            if (b2.samples.length >= 8) {
                                const sum = b2.samples.reduce((a, b) => a + b, 0);
                                b2.hipY = sum / b2.samples.length;
                                b2.isInitialized = true;
                            }
                        }
                        p2Ready = b2.isInitialized;
                    }

                    let everyoneReady = false;
                    if (p1Landmarks && p2Landmarks) {
                        everyoneReady = p1Ready && p2Ready;
                    } else if (p1Landmarks || p2Landmarks) {
                        everyoneReady = p1Ready || p2Ready;
                    }

                    if (everyoneReady && (p1Landmarks ? playerState.p1.baseline.isInitialized : true) && (p2Landmarks ? playerState.p2.baseline.isInitialized : true)) {
                        startCountdownPhase();
                    }
                }

                if (gameState === "PLAYING" && currentCommand && !roundScored) {
                    let p1Success = false;
                    let p2Success = false;

                    if (p1Landmarks) {
                        let matched = currentCommand.text === "蹲下" ? currentCommand.check(p1Landmarks, 'p1') : currentCommand.check(p1Landmarks);
                        if (matched) {
                            playerState.p1.actionConfirm++;
                        } else {
                            playerState.p1.actionConfirm = 0;
                        }
                        if (playerState.p1.actionConfirm >= CONFIG.detection.actionConfirmFrames) {
                            p1Success = true;
                        }
                    } else {
                        playerState.p1.actionConfirm = 0;
                    }

                    if (p2Landmarks) {
                        let matched = currentCommand.text === "蹲下" ? currentCommand.check(p2Landmarks, 'p2') : currentCommand.check(p2Landmarks);
                        if (matched) {
                            playerState.p2.actionConfirm++;
                        } else {
                            playerState.p2.actionConfirm = 0;
                        }
                        if (playerState.p2.actionConfirm >= CONFIG.detection.actionConfirmFrames) {
                            p2Success = true;
                        }
                    } else {
                        playerState.p2.actionConfirm = 0;
                    }

                    if ((p1Success || p2Success) && !roundScored) {
                        roundScored = true;
                        gameState = "ROUND_END";

                        if (p1Success) {
                            scoreP1++;
                            scoreP1El.innerText = scoreP1;
                            commandDisplay.style.color = "var(--success-color)";
                            commandDisplay.innerText = "P1 得分！";
                        } else if (p2Success) {
                            scoreP2++;
                            scoreP2El.innerText = scoreP2;
                            commandDisplay.style.color = "var(--success-color)";
                            commandDisplay.innerText = "P2 得分！";
                        }
                        setTimeout(startNeutralCheckPhase, CONFIG.timing.roundEndDelay);
                    }
                }

                canvasCtx.restore();
            }

            if (webcamRunning) {
                requestAnimationFrame(predictWebcam);
            }
        }
    </script>
</body>
</html>
