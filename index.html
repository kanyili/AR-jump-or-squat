<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>雙人AR遊戲</title>
    <style>
        :root {
            --bg-color: #0b0f19;          
            --primary-color: #00f3ff;     
            --success-color: #00ffcc;     
            --danger-color: #ff0055;      
            --warning-color: #ffaa00;     
            --text-color: #ffffff;        
            --border-glow: rgba(0, 243, 255, 0.2); 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        #rotate-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(11, 15, 25, 0.95);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #rotate-warning .icon {
            font-size: 48px;
            margin-bottom: 20px;
            animation: rotatePhone 2s infinite ease-in-out;
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        @media screen and (orientation: portrait) {
            #rotate-warning {
                display: flex;
            }
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* 畫面震動特效 Class */
        .screen-shake {
            animation: shakeAnimation 0.3s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shakeAnimation {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-10px, 8px) rotate(-1deg); }
            40% { transform: translate(10px, -8px) rotate(1deg); }
            60% { transform: translate(-8px, -6px) rotate(-0.5deg); }
            80% { transform: translate(8px, 6px) rotate(0.5deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        #webcam-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            transform: scaleX(-1);
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            pointer-events: none;
            box-sizing: border-box;
            padding: 10px 20px 16px 20px;
        }

        .interactive {
            pointer-events: auto;
        }

        .player-zone {
            width: 48%;
            height: 100%;
            max-height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 15px;
            position: relative;
            border: 2px dashed var(--border-glow);
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        /* 玩家區域紅綠交替脈衝特效內縮框 */
        .player-zone::after {
            content: '';
            position: absolute;
            inset: 4px;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 8;
            border: 4px solid transparent;
            box-shadow: none;
            transition: none;
        }

        .player-zone.pulse-effect::after {
            animation: redGreenPulse 1.0s ease-in-out forwards;
        }

        @keyframes redGreenPulse {
            0% {
                border-color: var(--success-color);
                box-shadow: 
                    inset 0 0 25px var(--success-color),
                    0 0 12px var(--success-color),
                    0 0 25px rgba(0, 255, 204, 0.45);
            }
            33% {
                border-color: var(--danger-color);
                box-shadow: 
                    inset 0 0 25px var(--danger-color),
                    0 0 12px var(--danger-color),
                    0 0 25px rgba(255, 0, 85, 0.45);
            }
            66% {
                border-color: var(--success-color);
                box-shadow: 
                    inset 0 0 25px var(--success-color),
                    0 0 12px var(--success-color),
                    0 0 25px rgba(0, 255, 204, 0.45);
            }
            100% {
                border-color: transparent;
                box-shadow: 
                    inset 0 0 0 rgba(0,0,0,0),
                    0 0 0 rgba(0,0,0,0);
            }
        }

        .player-header {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            margin-bottom: 10px;
        }

        .player-score {
            font-size: 3rem;
            font-weight: 900;
            color: var(--text-color);
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
            margin-bottom: 15px;
        }

        #command-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            background-color: #000000;
            padding: 10px 30px;
            text-align: center;
            pointer-events: none;
        }

        #command-display {
            font-size: 2.5rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
            line-height: 1.1;
            white-space: pre-line;
        }

        /* 字體彈跳與放大動畫 Class */
        .pop-bounce-anim {
            animation: popBounce 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popBounce {
            0% {
                transform: scale(0.2);
                opacity: 0;
                text-shadow: 0 0 0 rgba(255,255,255,0);
            }
            60% {
                transform: scale(1.3);
                opacity: 1;
                text-shadow: 0 0 30px var(--success-color), 0 0 60px var(--success-color);
            }
            100% {
                transform: scale(1.0);
                opacity: 1;
                text-shadow: 0 0 20px rgba(255,255,255,0.8);
            }
        }

        #overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: rgba(11, 15, 25, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .game-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--primary-color);
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), #0066ff);
            color: var(--text-color);
            border: none;
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }
        
        .btn-primary:disabled {
            background: #2a3b4c;
            color: #ff8080;
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div id="rotate-warning">
        <div class="icon">📱</div>
        <h2>請將手機轉為橫向</h2>
        <p>本遊戲需使用橫向畫面進行雙人 AR 互動</p>
    </div>

    <div id="game-container">
        <video id="webcam-video" autoplay playsinline muted></video>
        <canvas id="game-canvas"></canvas>

        <div id="ui-layer">
            <div class="player-zone" id="zone-p1">
                <div class="player-header">PLAYER 1</div>
                <div class="player-score" id="score-p1">0</div>
            </div>

            <div class="player-zone" id="zone-p2">
                <div class="player-header">PLAYER 2</div>
                <div class="player-score" id="score-p2">0</div>
            </div>
        </div>

        <div id="command-container">
            <div id="command-display">兩位玩家入鏡</div>
        </div>

        <div id="overlay-screen" class="interactive">
            <h1 class="game-title">雙人AR遊戲</h1>
            <button class="btn-primary" id="start-btn" disabled>正在初始化模組...</button>
        </div>
    </div>

    <script type="module">
        import { PoseLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/vision_bundle.mjs";

        const CONFIG = {
            timing: {
                countdownDelay: 100,[cite: 2]
                roundEndDelay: 1000,  [cite: 2]
                neutralToCountdownDelay: 100[cite: 2]
            },
            detection: {
                visibilityThreshold: 0.3,     [cite: 2]
                actionConfirmFrames: 2,     [cite: 2]
                handDownTolerance: 0.05,    [cite: 2]
                handRaiseMinDelta: 0.04,[cite: 2]
                handRaiseMinMove: 0.04      [cite: 2]
            },

            isLandmarkPositionValid: function(l, index) {
                if (!l || !l[index]) return false;
                const pt = l[index];
                return Number.isFinite(pt.x) && Number.isFinite(pt.y) &&
                       pt.x >= -0.08 && pt.x <= 1.08 &&
                       pt.y >= -0.08 && pt.y <= 1.08;
            },

            isLandmarkReliable: function(l, index, threshold = CONFIG.detection.visibilityThreshold) {
                if (!CONFIG.isLandmarkPositionValid(l, index)) return false;
                const vis = l[index].visibility ?? 1.0;
                return vis >= threshold;
            },

            isBodyInFrame: function(l) {
                if (!l) return false;
                const valid = (idx) => CONFIG.isLandmarkPositionValid(l, idx);
                const hasShoulders = valid(11) && valid(12);
                const hasHips = valid(23) && valid(24);
                return hasShoulders && hasHips;
            },

            commands: [
                { 
                    text: "Left arm", 
                    check: (l, playerKey) => {
                        if (!CONFIG.isLandmarkReliable(l, 15) || !CONFIG.isLandmarkReliable(l, 11)) return false;
                        if (!CONFIG.isLandmarkReliable(l, 16) || !CONFIG.isLandmarkReliable(l, 12)) return false;
                        const pState = playerState[playerKey];
                        const shoulderLY = l[11].y;
                        const wristLY = l[15].y;
                        const shoulderRY = l[12].y;
                        const wristRY = l[16].y;
                        
                        const dist = (p1, p2) => Math.hypot(p1.x - p2.x, p1.y - p2.y);
                        const bodyScale = dist(l[11], l[23]) || 0.5;

                        const isLeftUp = (wristLY < shoulderLY - CONFIG.detection.handRaiseMinDelta) && 
                                         ((pState.commandStartLeftWristY - wristLY) >= (CONFIG.detection.handRaiseMinMove * bodyScale));
                        const isRightDown = wristRY >= shoulderRY - CONFIG.detection.handDownTolerance;
                        return isLeftUp && isRightDown;
                    } 
                },
                { 
                    text: "Right arm", 
                    check: (l, playerKey) => {
                        if (!CONFIG.isLandmarkReliable(l, 16) || !CONFIG.isLandmarkReliable(l, 12)) return false;
                        if (!CONFIG.isLandmarkReliable(l, 15) || !CONFIG.isLandmarkReliable(l, 11)) return false;
                        const pState = playerState[playerKey];
                        const shoulderLY = l[11].y;
                        const wristLY = l[15].y;
                        const shoulderRY = l[12].y;
                        const wristRY = l[16].y;

                        const dist = (p1, p2) => Math.hypot(p1.x - p2.x, p1.y - p2.y);
                        const bodyScale = dist(l[12], l[24]) || 0.5;

                        const isRightUp = (wristRY < shoulderRY - CONFIG.detection.handRaiseMinDelta) && 
                                          ((pState.commandStartRightWristY - wristRY) >= (CONFIG.detection.handRaiseMinMove * bodyScale));
                        const isLeftDown = wristLY >= shoulderLY - CONFIG.detection.handDownTolerance;
                        return isRightUp && isLeftDown;
                    } 
                },
                {
                    text: "Both arms",
                    check: (l, playerKey) => {
                        if (!CONFIG.isLandmarkReliable(l, 15) || !CONFIG.isLandmarkReliable(l, 11)) return false;
                        if (!CONFIG.isLandmarkReliable(l, 16) || !CONFIG.isLandmarkReliable(l, 12)) return false;
                        const pState = playerState[playerKey];
                        const shoulderLY = l[11].y;
                        const wristLY = l[15].y;
                        const shoulderRY = l[12].y;
                        const wristRY = l[16].y;

                        const dist = (p1, p2) => Math.hypot(p1.x - p2.x, p1.y - p2.y);
                        const bodyScale = dist(l[11], l[23]) || 0.5;

                        const isLeftUp = (wristLY < shoulderLY - CONFIG.detection.handRaiseMinDelta) && 
                                         ((pState.commandStartLeftWristY - wristLY) >= (CONFIG.detection.handRaiseMinMove * bodyScale));
                        const isRightUp = (wristRY < shoulderRY - CONFIG.detection.handRaiseMinDelta) && 
                                          ((pState.commandStartRightWristY - wristRY) >= (CONFIG.detection.handRaiseMinMove * bodyScale));
                        return isLeftUp && isRightUp;
                    }
                }
            ],
            
            neutralCheck: function(l) {
                const tolerance = CONFIG.detection.handDownTolerance;
                const isVisible = CONFIG.isLandmarkPositionValid(l, 11) && CONFIG.isLandmarkPositionValid(l, 12) && 
                                  CONFIG.isLandmarkPositionValid(l, 23) && CONFIG.isLandmarkPositionValid(l, 24);   

                if (!isVisible) return false;
                
                const leftWristReliable = CONFIG.isLandmarkReliable(l, 15);
                const rightWristReliable = CONFIG.isLandmarkReliable(l, 16);
                const leftHandsDown = !leftWristReliable || (l[15].y >= l[11].y - tolerance);
                const rightHandsDown = !rightWristReliable || (l[16].y >= l[12].y - tolerance);

                return leftHandsDown && rightHandsDown;
            }
        };

        const playerState = {
            p1: { actionConfirm: 0, lastCenterX: 0.75, commandStartLeftWristY: 0, commandStartRightWristY: 0, reactionTime: null },
            p2: { actionConfirm: 0, lastCenterX: 0.25, commandStartLeftWristY: 0, commandStartRightWristY: 0, reactionTime: null }
        };

        let poseLandmarker = undefined;
        let webcamRunning = false;
        let lastVideoTime = -1;

        let scoreP1 = 0;
        let scoreP2 = 0;
        let gameState = "IDLE"; 
        let currentCommand = null; 
        let roundScored = false;
        let roundId = 0;
        let commandStartTime = 0;
        let latestPosesSnapshot = []; 
        let neutralCountdownTimer = null; 

        const startBtn = document.getElementById('start-btn');
        const overlayScreen = document.getElementById('overlay-screen');
        const webcamVideo = document.getElementById('webcam-video');
        const canvasElement = document.getElementById('game-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const drawingUtils = new DrawingUtils(canvasCtx);

        const gameContainer = document.getElementById('game-container');
        const commandDisplay = document.getElementById('command-display');
        const scoreP1El = document.getElementById('score-p1');
        const scoreP2El = document.getElementById('score-p2');
        const zoneP1 = document.getElementById('zone-p1');
        const zoneP2 = document.getElementById('zone-p2');

        async function preloadModel() {
            try {
                startBtn.innerText = "正在載入 WASM...";
                const visionFilesetResolver = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/wasm"
                );
                startBtn.innerText = "正在載入 AI 模型...";
                poseLandmarker = await PoseLandmarker.createFromOptions(visionFilesetResolver, {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numPoses: 2
                });
                startBtn.disabled = false;
                startBtn.innerText = "開始遊戲";
            } catch (err) {
                startBtn.innerText = "錯誤: " + err.message;
            }
        }

        preloadModel();

        startBtn.addEventListener('click', async () => {
            if (!poseLandmarker) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                webcamVideo.srcObject = stream;
                webcamVideo.addEventListener('loadeddata', () => {
                    webcamRunning = true;
                    overlayScreen.style.opacity = '0';
                    setTimeout(() => overlayScreen.style.display = 'none', 300);
                    requestAnimationFrame(predictWebcam);
                    startNeutralCheckPhase(); 
                });
            } catch (err) {
                alert('無法啟用攝影機');
            }
        });

        function startNeutralCheckPhase() {
            roundId++;
            gameState = "WAITING_FOR_NEUTRAL";
            currentCommand = null;
            roundScored = false;
            commandStartTime = 0;
            
            if (neutralCountdownTimer) {
                clearTimeout(neutralCountdownTimer);
                neutralCountdownTimer = null;
            }
            
            playerState.p1.actionConfirm = 0;
            playerState.p1.reactionTime = null;
            playerState.p2.actionConfirm = 0;
            playerState.p2.reactionTime = null;

            commandDisplay.innerText = "兩位玩家入鏡";
        }

        function startCountdownPhase() {
            const currentRoundId = ++roundId;
            gameState = "COUNTDOWN";
            playerState.p1.actionConfirm = 0;
            playerState.p1.reactionTime = null;
            playerState.p2.actionConfirm = 0;
            playerState.p2.reactionTime = null;
            roundScored = false;
            
            setTimeout(() => {
                if (!webcamRunning || gameState !== "COUNTDOWN" || roundId !== currentRoundId) return;
                
                const { p1Landmarks, p2Landmarks } = updatePlayerTracking(latestPosesSnapshot);
                
                if (p1Landmarks) {
                    playerState.p1.commandStartLeftWristY = p1Landmarks[15] ? p1Landmarks[15].y : 0;
                    playerState.p1.commandStartRightWristY = p1Landmarks[16] ? p1Landmarks[16].y : 0;
                }
                if (p2Landmarks) {
                    playerState.p2.commandStartLeftWristY = p2Landmarks[15] ? p2Landmarks[15].y : 0;
                    playerState.p2.commandStartRightWristY = p2Landmarks[16] ? p2Landmarks[16].y : 0;
                }

                const randomCmd = CONFIG.commands[Math.floor(Math.random() * CONFIG.commands.length)];
                currentCommand = randomCmd;
                commandStartTime = performance.now(); 
                gameState = "PLAYING"; 
                
                commandDisplay.innerText = randomCmd.text;
            }, CONFIG.timing.countdownDelay);
        }

        function updatePlayerTracking(poses) {
            let validPoses = [];

            for (const pose of poses) {
                if (!pose || !pose[23] || !pose[24]) continue;
                if (!CONFIG.isLandmarkPositionValid(pose, 23) || !CONFIG.isLandmarkPositionValid(pose, 24)) continue;
                const centerX = (pose[23].x + pose[24].x) / 2;
                validPoses.push({ pose, centerX });
            }

            if (validPoses.length === 0) {
                return { p1Landmarks: null, p2Landmarks: null };
            }

            let p1Landmarks = null;
            let p2Landmarks = null;
            const maxTrackingDist = 0.30;

            if (validPoses.length === 1) {
                const item = validPoses[0];
                const distToP1 = Math.abs(item.centerX - playerState.p1.lastCenterX);
                const distToP2 = Math.abs(item.centerX - playerState.p2.lastCenterX);
                
                if (distToP1 <= distToP2 && distToP1 <= maxTrackingDist) {
                    p1Landmarks = item.pose;
                    playerState.p1.lastCenterX = item.centerX;
                } else if (distToP2 < distToP1 && distToP2 <= maxTrackingDist) {
                    p2Landmarks = item.pose;
                    playerState.p2.lastCenterX = item.centerX;
                } else {
                    if (item.centerX >= 0.5) {
                        p1Landmarks = item.pose;
                        playerState.p1.lastCenterX = item.centerX;
                    } else {
                        p2Landmarks = item.pose;
                        playerState.p2.lastCenterX = item.centerX;
                    }
                }
            } else {
                validPoses.sort((a, b) => a.centerX - b.centerX);
                const pA = validPoses[0]; 
                const pB = validPoses[1]; 

                p1Landmarks = pB.pose;
                p2Landmarks = pA.pose;
                playerState.p1.lastCenterX = pB.centerX;
                playerState.p2.lastCenterX = pA.centerX;
            }

            return { p1Landmarks, p2Landmarks };
        }

        function triggerWinEffect(winner) {
            // 1. 僅觸發得分玩家的紅綠交替脈衝特效
            if (winner === "P1") {
                zoneP1.classList.add('pulse-effect');
                setTimeout(() => zoneP1.classList.remove('pulse-effect'), 1000);
            } else if (winner === "P2") {
                zoneP2.classList.add('pulse-effect');
                setTimeout(() => zoneP2.classList.remove('pulse-effect'), 1000);
            } else if (winner === "DRAW") {
                zoneP1.classList.add('pulse-effect');
                zoneP2.classList.add('pulse-effect');
                setTimeout(() => {
                    zoneP1.classList.remove('pulse-effect');
                    zoneP2.classList.remove('pulse-effect');
                }, 1000);
            }

            // 2. 觸發畫面高對比動態震動
            gameContainer.classList.add('screen-shake');
            setTimeout(() => gameContainer.classList.remove('screen-shake'), 300);

            // 3. 觸發字體彈跳與放大動畫
            commandDisplay.classList.remove('pop-bounce-anim');
            void commandDisplay.offsetWidth; // 重置動畫
            commandDisplay.classList.add('pop-bounce-anim');
            setTimeout(() => commandDisplay.classList.remove('pop-bounce-anim'), 500);
        }

        async function predictWebcam() {
            if (canvasElement.width !== webcamVideo.videoWidth || canvasElement.height !== webcamVideo.videoHeight) {
                canvasElement.width = webcamVideo.videoWidth;
                canvasElement.height = webcamVideo.videoHeight;
            }

            let startTimeMs = performance.now();
            if (lastVideoTime !== webcamVideo.currentTime) {
                lastVideoTime = webcamVideo.currentTime;
                const poseResult = poseLandmarker.detectForVideo(webcamVideo, startTimeMs);

                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

                let rawPoses = poseResult.landmarks || [];
                latestPosesSnapshot = rawPoses; 

                for (const landmarks of rawPoses) {
                    drawingUtils.drawConnectors(landmarks, PoseLandmarker.POSE_CONNECTIONS, { color: '#00F3FF', lineWidth: 3 });
                    drawingUtils.drawLandmarks(landmarks, { color: '#FF0055', radius: 4 });
                }

                const { p1Landmarks, p2Landmarks } = updatePlayerTracking(rawPoses);

                const p1InFrame = p1Landmarks && CONFIG.isBodyInFrame(p1Landmarks);
                const p2InFrame = p2Landmarks && CONFIG.isBodyInFrame(p2Landmarks);

                if (gameState === "WAITING_FOR_NEUTRAL") {
                    let p1Ready = p1Landmarks && p1InFrame && CONFIG.neutralCheck(p1Landmarks);
                    let p2Ready = p2Landmarks && p2InFrame && CONFIG.neutralCheck(p2Landmarks);

                    const everyoneReady = p1Landmarks && p2Landmarks && p1InFrame && p2InFrame && p1Ready && p2Ready;

                    if (!p1Landmarks || !p2Landmarks) {
                        commandDisplay.innerText = "兩位玩家入鏡";
                    } else if (!p1Ready || !p2Ready) {
                        commandDisplay.innerText = "站直、手放下";
                    }

                    if (everyoneReady && !neutralCountdownTimer) {    
                        neutralCountdownTimer = setTimeout(() => {        
                            neutralCountdownTimer = null;        
                            if (gameState === "WAITING_FOR_NEUTRAL") {            
                                startCountdownPhase();        
                            }    
                        }, CONFIG.timing.neutralToCountdownDelay);
                    }
                }

                if (gameState === "PLAYING" && currentCommand && !roundScored) {
                    let p1Success = false;
                    let p2Success = false;

                    if (p1Landmarks) {
                        let matched = currentCommand.check(p1Landmarks, 'p1');
                        if (matched) {
                            playerState.p1.actionConfirm++;
                        } else {
                            playerState.p1.actionConfirm = 0;
                        }
                        if (playerState.p1.actionConfirm >= CONFIG.detection.actionConfirmFrames) {
                            p1Success = true;
                            if (!playerState.p1.reactionTime) {
                                playerState.p1.reactionTime = performance.now() - commandStartTime;
                            }
                        }
                    } else {
                        playerState.p1.actionConfirm = 0;
                    }

                    if (p2Landmarks) {
                        let matched = currentCommand.check(p2Landmarks, 'p2');
                        if (matched) {
                            playerState.p2.actionConfirm++;
                        } else {
                            playerState.p2.actionConfirm = 0;
                        }
                        if (playerState.p2.actionConfirm >= CONFIG.detection.actionConfirmFrames) {
                            p2Success = true;
                            if (!playerState.p2.reactionTime) {
                                playerState.p2.reactionTime = performance.now() - commandStartTime;
                            }
                        }
                    } else {
                        playerState.p2.actionConfirm = 0;
                    }

                    if ((p1Success || p2Success) && !roundScored) {
                        roundScored = true;
                        gameState = "ROUND_END";

                        let winner = null;
                        const rt1 = playerState.p1.reactionTime || 99999;
                        const rt2 = playerState.p2.reactionTime || 99999;

                        if (p1Success && p2Success) {
                            const diff = Math.abs(rt1 - rt2);
                            if (diff < 50) {
                                winner = "DRAW";
                            } else if (rt1 < rt2) {
                                winner = "P1";
                            } else {
                                winner = "P2";
                            }
                        } else if (p1Success) {
                            winner = "P1";
                        } else if (p2Success) {
                            winner = "P2";
                        }

                        if (winner === "DRAW") {
                            commandDisplay.innerText = "平手";
                            triggerWinEffect("DRAW");
                        } else if (winner === "P1") {
                            scoreP1++;
                            scoreP1El.innerText = scoreP1;
                            commandDisplay.innerText = "P1 Win";
                            triggerWinEffect("P1");
                        } else if (winner === "P2") {
                            scoreP2++;
                            scoreP2El.innerText = scoreP2;
                            commandDisplay.innerText = "P2 Win";
                            triggerWinEffect("P2");
                        }
                        setTimeout(startNeutralCheckPhase, CONFIG.timing.roundEndDelay);
                    }
                }

                canvasCtx.restore();
            }

            if (webcamRunning) {
                requestAnimationFrame(predictWebcam);
            }
        }
    </script>
