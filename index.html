<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>雙人 AR 反應速度遊戲</title>
    <style>
        :root {
            --bg-color: #0b0f19;          
            --primary-color: #00f3ff;     
            --success-color: #00ffcc;     
            --danger-color: #ff0055;      
            --warning-color: #ffaa00;     
            --text-color: #ffffff;        
            --hud-bg: rgba(11, 15, 25, 0.4); 
            --border-glow: rgba(0, 243, 255, 0.2); 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        #rotate-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(11, 15, 25, 0.95);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #rotate-warning .icon {
            font-size: 48px;
            margin-bottom: 20px;
            animation: rotatePhone 2s infinite ease-in-out;
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        @media screen and (orientation: portrait) {
            #rotate-warning {
                display: flex;
            }
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #webcam-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            transform: scaleX(-1);
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: flex;
            flex-direction: row;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        .player-zone {
            width: 42%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 20px;
            position: relative;
            border: 2px dashed var(--border-glow);
        }

        #zone-p1 { border-right: none; }
        #zone-p2 { border-left: none; }

        .center-hud {
            width: 16%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px 5px;
            background: var(--hud-bg);
            backdrop-filter: blur(4px);
            border-left: 1px solid var(--border-glow);
            border-right: 1px solid var(--border-glow);
        }

        .player-header {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            margin-bottom: 10px;
        }

        .player-score {
            font-size: 3rem;
            font-weight: 900;
            color: var(--text-color);
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
            margin-bottom: 15px;
        }

        .player-status-msg {
            background: rgba(255, 77, 77, 0.8);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.5);
            display: none;
            margin-bottom: 10px;
        }

        .debug-panel {
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid var(--primary-color);
            padding: 8px;
            border-radius: 8px;
            font-size: 0.65rem;
            color: #00ffcc;
            width: 100%;
            max-width: 240px;
            display: none;
            line-height: 1.3;
            text-align: left;
            overflow-y: auto;
            max-height: 60vh;
        }

        #command-display {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--primary-color);
            text-shadow: 0 0 20px var(--primary-color);
            text-align: center;
            line-height: 1.4;
        }

        #version-stamp {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.8);
            background: rgba(11, 15, 25, 0.6);
            padding: 4px 12px;
            border-radius: 12px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            backdrop-filter: blur(4px);
            letter-spacing: 0.5px;
            white-space: nowrap;
            pointer-events: none;
        }

        #overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: rgba(11, 15, 25, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .game-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--primary-color);
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), #0066ff);
            color: var(--text-color);
            border: none;
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }
        
        .btn-primary:disabled {
            background: #2a3b4c;
            color: #ff8080;
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div id="version-stamp">2026-06-06 16:30:00 (Fixed)</div>

    <div id="rotate-warning">
        <div class="icon">📱</div>
        <h2>請將手機轉為橫向</h2>
        <p>本遊戲需使用橫向畫面進行雙人 AR 互動</p>
    </div>

    <div id="game-container">
        <video id="webcam-video" autoplay playsinline muted></video>
        <canvas id="game-canvas"></canvas>

        <div id="ui-layer">
            <div class="player-zone" id="zone-p1">
                <div class="player-header">PLAYER 1</div>
                <div class="player-score" id="score-p1">0</div>
                <div class="player-status-msg" id="msg-p1">請完整入鏡</div>
                <div class="debug-panel" id="debug-p1"></div>
            </div>

            <div class="center-hud">
                <div id="command-display">等待雙人入鏡</div>
            </div>

            <div class="player-zone" id="zone-p2">
                <div class="player-header">PLAYER 2</div>
                <div class="player-score" id="score-p2">0</div>
                <div class="player-status-msg" id="msg-p2">請完整入鏡</div>
                <div class="debug-panel" id="debug-p2"></div>
            </div>
        </div>

        <div id="overlay-screen" class="interactive">
            <h1 class="game-title">雙人 AR 反應速度遊戲</h1>
            <button class="btn-primary" id="start-btn" disabled>正在初始化模組...</button>
        </div>
    </div>

    <script type="module">
        import { PoseLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/vision_bundle.mjs";

        const DEBUG = false;

        const CONFIG = {
            timing: {
                countdownDelay: 1500, 
                roundEndDelay: 2000   
            },
            detection: {
                visibilityThreshold: 0.3,   
                neutralCrouchMax: 0.70,      
                squatKneeAngleMax: 165,      
                squatMinHipDropRatio: 0.02,  
                squatHistoryFrames: 5,       
                actionConfirmFrames: 2,      
                handDownTolerance: 0.05,     
                handRaiseMinDelta: 0.04,
                handRaiseMinMove: 0.04       
            },

            isLandmarkPositionValid: function(l, index) {
                if (!l || !l[index]) return false;
                const pt = l[index];
                return Number.isFinite(pt.x) && Number.isFinite(pt.y) &&
                       pt.x >= -0.08 && pt.x <= 1.08 &&
                       pt.y >= -0.08 && pt.y <= 1.08;
            },

            isLandmarkReliable: function(l, index, threshold = CONFIG.detection.visibilityThreshold) {
                if (!CONFIG.isLandmarkPositionValid(l, index)) return false;
                const vis = l[index].visibility ?? 1.0;
                return vis >= threshold;
            },

            isBodyInFrame: function(l) {
                if (!l) return false;
                const valid = (idx) => CONFIG.isLandmarkPositionValid(l, idx);
                const hasShoulders = valid(11) && valid(12);
                const hasHips = valid(23) && valid(24);
                if (!hasShoulders || !hasHips) return false;
                const hasLegs = (valid(25) || valid(26)) && (valid(27) || valid(28));
                return hasLegs;
            },

            getSkeletonStats: function(l) {
                if (!l) return { shoulder: false, hip: false, knee: false, ankle: false, minX: 0, maxX: 0, minY: 0, maxY: 0 };
                const valid = (idx) => CONFIG.isLandmarkPositionValid(l, idx);
                const shoulder = valid(11) && valid(12);
                const hip = valid(23) && valid(24);
                const knee = valid(25) || valid(26);
                const ankle = valid(27) || valid(28);

                let xs = [], ys = [];
                [11, 12, 23, 24, 25, 26, 27, 28].forEach(idx => {
                    if (valid(idx)) {
                        xs.push(l[idx].x);
                        ys.push(l[idx].y);
                    }
                });

                return {
                    shoulder, hip, knee, ankle,
                    minX: xs.length ? Math.min(...xs) : 0,
                    maxX: xs.length ? Math.max(...xs) : 0,
                    minY: ys.length ? Math.min(...ys) : 0,
                    maxY: ys.length ? Math.max(...ys) : 0
                };
            },

            commands: [
                { 
                    text: "舉左手", 
                    check: (l, playerKey) => {
                        if (!CONFIG.isLandmarkReliable(l, 15) || !CONFIG.isLandmarkReliable(l, 11)) return false;
                        const pState = playerState[playerKey];
                        const shoulderY = l[11].y;
                        const wristY = l[15].y;
                        
                        const dist = (p1, p2) => Math.hypot(p1.x - p2.x, p1.y - p2.y);
                        const bodyScale = (dist(l[11], l[23]) + dist(l[23], l[25]) + dist(l[25], l[27])) || 0.5;

                        const isAboveShoulder = wristY < shoulderY - CONFIG.detection.handRaiseMinDelta;
                        const hasMovedUp = (pState.commandStartLeftWristY - wristY) >= (CONFIG.detection.handRaiseMinMove * bodyScale);

                        return isAboveShoulder && hasMovedUp;
                    } 
                },
                { 
                    text: "舉右手", 
                    check: (l, playerKey) => {
                        if (!CONFIG.isLandmarkReliable(l, 16) || !CONFIG.isLandmarkReliable(l, 12)) return false;
                        const pState = playerState[playerKey];
                        const shoulderY = l[12].y;
                        const wristY = l[16].y;

                        const dist = (p1, p2) => Math.hypot(p1.x - p2.x, p1.y - p2.y);
                        const bodyScale = (dist(l[12], l[24]) + dist(l[24], l[26]) + dist(l[26], l[28])) || 0.5;

                        const isAboveShoulder = wristY < shoulderY - CONFIG.detection.handRaiseMinDelta;
                        const hasMovedUp = (pState.commandStartRightWristY - wristY) >= (CONFIG.detection.handRaiseMinMove * bodyScale);

                        return isAboveShoulder && hasMovedUp;
                    } 
                },
                { 
                    text: "蹲下",   
                    check: (l, playerKey = 'p1') => {
                        if (!CONFIG.isLandmarkPositionValid(l, 23) || !CONFIG.isLandmarkPositionValid(l, 24) || 
                            !CONFIG.isLandmarkPositionValid(l, 11) || !CONFIG.isLandmarkPositionValid(l, 12)) return false;

                        const hip = { x: (l[23].x + l[24].x) / 2, y: (l[23].y + l[24].y) / 2 };

                        let knee = null, ankle = null;
                        if (CONFIG.isLandmarkPositionValid(l, 25) && CONFIG.isLandmarkPositionValid(l, 27)) {
                            knee = { x: l[25].x, y: l[25].y };
                            ankle = { x: l[27].x, y: l[27].y };
                        } else if (CONFIG.isLandmarkPositionValid(l, 26) && CONFIG.isLandmarkPositionValid(l, 28)) {
                            knee = { x: l[26].x, y: l[26].y };
                            ankle = { x: l[28].x, y: l[28].y };
                        }
                        if (!knee || !ankle) return false;

                        const getAngle = (a, b, c) => {
                            const ab = { x: a.x - b.x, y: a.y - b.y };
                            const cb = { x: c.x - b.x, y: c.y - b.y };
                            const dot = ab.x * cb.x + ab.y * cb.y;
                            const magAB = Math.hypot(ab.x, ab.y);
                            const magCB = Math.hypot(cb.x, cb.y);
                            if (magAB === 0 || magCB === 0) return 180;
                            let rad = Math.acos(Math.max(-1, Math.min(1, dot / (magAB * magCB))));
                            return rad * (180 / Math.PI);
                        };

                        const kneeAngle = getAngle(hip, knee, ankle);
                        return kneeAngle < CONFIG.detection.squatKneeAngleMax;
                    } 
                }
            ],
            
            neutralCheck: function(l) {
                const tolerance = CONFIG.detection.handDownTolerance;
                const isVisible = CONFIG.isLandmarkPositionValid(l, 11) && CONFIG.isLandmarkPositionValid(l, 12) && 
                                  CONFIG.isLandmarkPositionValid(l, 23) && CONFIG.isLandmarkPositionValid(l, 24);   

                if (!isVisible) return false;

                const notCrouching = (l[23].y + l[24].y) / 2 < CONFIG.detection.neutralCrouchMax; 
                
                const leftWristReliable = CONFIG.isLandmarkReliable(l, 15);
                const rightWristReliable = CONFIG.isLandmarkReliable(l, 16);
                const leftHandsDown = !leftWristReliable || (l[15].y >= l[11].y - tolerance);
                const rightHandsDown = !rightWristReliable || (l[16].y >= l[12].y - tolerance);

                return notCrouching && leftHandsDown && rightHandsDown;
            }
        };

        const playerState = {
            p1: {
                baseline: { samples: [], hipY: 0, isInitialized: false },
                squatHistory: [],
                actionConfirm: 0,
                lastCenterX: 0.75, // [已修正] P1 在畫面左側，對應攝影機物理座標右側 (0.75)
                trackingDistance: 0,
                identityMaintained: true,
                reactionTime: null,
                commandStartLeftWristY: 0,
                commandStartRightWristY: 0
            },
            p2: {
                baseline: { samples: [], hipY: 0, isInitialized: false },
                squatHistory: [],
                actionConfirm: 0,
                lastCenterX: 0.25, // [已修正] P2 在畫面右側，對應攝影機物理座標左側 (0.25)
                trackingDistance: 0,
                identityMaintained: true,
                reactionTime: null,
                commandStartLeftWristY: 0,
                commandStartRightWristY: 0
            }
        };

        let poseLandmarker = undefined;
        let webcamRunning = false;
        let lastVideoTime = -1;

        let scoreP1 = 0;
        let scoreP2 = 0;
        let gameState = "IDLE"; 
        let currentCommand = null; 
        let roundScored = false;
        let roundId = 0;
        let commandStartTime = 0;

        const startBtn = document.getElementById('start-btn');
        const overlayScreen = document.getElementById('overlay-screen');
        const webcamVideo = document.getElementById('webcam-video');
        const canvasElement = document.getElementById('game-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const drawingUtils = new DrawingUtils(canvasCtx);

        const commandDisplay = document.getElementById('command-display');
        const scoreP1El = document.getElementById('score-p1');
        const scoreP2El = document.getElementById('score-p2');
        const msgP1El = document.getElementById('msg-p1');
        const msgP2El = document.getElementById('msg-p2');
        const debugP1El = document.getElementById('debug-p1');
        const debugP2El = document.getElementById('debug-p2');

        if (DEBUG) {
            debugP1El.style.display = 'block';
            debugP2El.style.display = 'block';
        }

        async function preloadModel() {
            try {
                startBtn.innerText = "正在載入 WASM...";
                const visionFilesetResolver = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/wasm"
                );
                startBtn.innerText = "正在載入 AI 模型...";
                poseLandmarker = await PoseLandmarker.createFromOptions(visionFilesetResolver, {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numPoses: 2
                });
                startBtn.disabled = false;
                startBtn.innerText = "開始遊戲";
            } catch (err) {
                startBtn.innerText = "錯誤: " + err.message;
            }
        }

        preloadModel();

        startBtn.addEventListener('click', async () => {
            if (!poseLandmarker) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                webcamVideo.srcObject = stream;
                webcamVideo.addEventListener('loadeddata', () => {
                    webcamRunning = true;
                    overlayScreen.style.opacity = '0';
                    setTimeout(() => overlayScreen.style.display = 'none', 300);
                    requestAnimationFrame(predictWebcam);
                    startNeutralCheckPhase(); 
                });
            } catch (err) {
                alert('無法啟用攝影機');
            }
        });

        function startNeutralCheckPhase() {
            roundId++;
            gameState = "WAITING_FOR_NEUTRAL";
            currentCommand = null;
            roundScored = false;
            commandStartTime = 0;
            
            playerState.p1.squatHistory = [];
            playerState.p1.actionConfirm = 0;
            playerState.p1.reactionTime = null;
            playerState.p2.squatHistory = [];
            playerState.p2.actionConfirm = 0;
            playerState.p2.reactionTime = null;

            commandDisplay.style.color = "var(--primary-color)";
            commandDisplay.innerText = "請雙手放下\n維持站好";
        }

        function startCountdownPhase() {
            const currentRoundId = ++roundId;
            gameState = "COUNTDOWN";
            playerState.p1.squatHistory = [];
            playerState.p1.actionConfirm = 0;
            playerState.p1.reactionTime = null;
            playerState.p2.squatHistory = [];
            playerState.p2.actionConfirm = 0;
            playerState.p2.reactionTime = null;
            roundScored = false;

            commandDisplay.style.color = "var(--warning-color)";
            commandDisplay.innerText = "準備...";
            
            setTimeout(() => {
                if (!webcamRunning || gameState !== "COUNTDOWN" || roundId !== currentRoundId) return;
                const randomCmd = CONFIG.commands[Math.floor(Math.random() * CONFIG.commands.length)];
                currentCommand = randomCmd;
                commandStartTime = performance.now();
                gameState = "PLAYING"; 
                commandDisplay.style.color = "var(--danger-color)";
                commandDisplay.innerText = randomCmd.text;
            }, CONFIG.timing.countdownDelay);
        }

        function updatePlayerTracking(poses) {
            let validPoses = [];

            for (const pose of poses) {
                if (!pose || !pose[23] || !pose[24]) continue;
                if (!CONFIG.isLandmarkPositionValid(pose, 23) || !CONFIG.isLandmarkPositionValid(pose, 24)) continue;
                const centerX = (pose[23].x + pose[24].x) / 2;
                const centerY = (pose[23].y + pose[24].y) / 2;
                validPoses.push({ pose, centerX, centerY });
            }

            if (validPoses.length === 0) {
                playerState.p1.trackingDistance = 0;
                playerState.p2.trackingDistance = 0;
                playerState.p1.identityMaintained = false;
                playerState.p2.identityMaintained = false;
                return { p1Landmarks: null, p2Landmarks: null };
            }

            let p1Landmarks = null;
            let p2Landmarks = null;
            const maxTrackingDist = 0.30;

            if (validPoses.length === 1) {
                const item = validPoses[0];
                const distToP1 = Math.abs(item.centerX - playerState.p1.lastCenterX);
                const distToP2 = Math.abs(item.centerX - playerState.p2.lastCenterX);
                
                if (distToP1 <= distToP2 && distToP1 <= maxTrackingDist) {
                    p1Landmarks = item.pose;
                    playerState.p1.trackingDistance = distToP1;
                    playerState.p1.identityMaintained = true;
                    playerState.p1.lastCenterX = item.centerX;
                } else if (distToP2 < distToP1 && distToP2 <= maxTrackingDist) {
                    p2Landmarks = item.pose;
                    playerState.p2.trackingDistance = distToP2;
                    playerState.p2.identityMaintained = true;
                    playerState.p2.lastCenterX = item.centerX;
                } else {
                    if (item.centerX >= 0.5) {
                        p1Landmarks = item.pose;
                        playerState.p1.trackingDistance = 0;
                        playerState.p1.identityMaintained = false;
                        playerState.p1.lastCenterX = item.centerX;
                    } else {
                        p2Landmarks = item.pose;
                        playerState.p2.trackingDistance = 0;
                        playerState.p2.identityMaintained = false;
                        playerState.p2.lastCenterX = item.centerX;
                    }
                }
            } else {
                validPoses.sort((a, b) => a.centerX - b.centerX);
                const pA = validPoses[0]; // 畫面右側 (物理座標小，對應 P2)
                const pB = validPoses[1]; // 畫面左側 (物理座標大，對應 P1)

                // 讓 pB 配對 P1，pA 配對 P2
                p1Landmarks = pB.pose;
                p2Landmarks = pA.pose;
                playerState.p1.trackingDistance = Math.abs(pB.centerX - playerState.p1.lastCenterX);
                playerState.p2.trackingDistance = Math.abs(pA.centerX - playerState.p2.lastCenterX);
                playerState.p1.identityMaintained = true;
                playerState.p2.identityMaintained = true;
                playerState.p1.lastCenterX = pB.centerX;
                playerState.p2.lastCenterX = pA.centerX;
            }

            return { p1Landmarks, p2Landmarks };
        }

        async function predictWebcam() {
            if (canvasElement.width !== webcamVideo.videoWidth || canvasElement.height !== webcamVideo.videoHeight) {
                canvasElement.width = webcamVideo.videoWidth;
                canvasElement.height = webcamVideo.videoHeight;
            }

            let startTimeMs = performance.now();
            if (lastVideoTime !== webcamVideo.currentTime) {
                lastVideoTime = webcamVideo.currentTime;
                const poseResult = poseLandmarker.detectForVideo(webcamVideo, startTimeMs);

                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

                let rawPoses = poseResult.landmarks || [];
                for (const landmarks of rawPoses) {
                    drawingUtils.drawConnectors(landmarks, PoseLandmarker.POSE_CONNECTIONS, { color: '#00F3FF', lineWidth: 3 });
                    drawingUtils.drawLandmarks(landmarks, { color: '#FF0055', radius: 4 });
                }

                const { p1Landmarks, p2Landmarks } = updatePlayerTracking(rawPoses);

                const p1InFrame = p1Landmarks && CONFIG.isBodyInFrame(p1Landmarks);
                const p2InFrame = p2Landmarks && CONFIG.isBodyInFrame(p2Landmarks);

                if (gameState === "PLAYING" && playerState.p1.commandStartLeftWristY === 0 && p1Landmarks) {
                    playerState.p1.commandStartLeftWristY = p1Landmarks[15] ? p1Landmarks[15].y : 0;
                    playerState.p1.commandStartRightWristY = p1Landmarks[16] ? p1Landmarks[16].y : 0;
                }
                if (gameState === "PLAYING" && playerState.p2.commandStartLeftWristY === 0 && p2Landmarks) {
                    playerState.p2.commandStartLeftWristY = p2Landmarks[15] ? p2Landmarks[15].y : 0;
                    playerState.p2.commandStartRightWristY = p2Landmarks[16] ? p2Landmarks[16].y : 0;
                }
                if (gameState !== "PLAYING") {
                    if (p1Landmarks) {
                        playerState.p1.commandStartLeftWristY = p1Landmarks[15] ? p1Landmarks[15].y : 0;
                        playerState.p1.commandStartRightWristY = p1Landmarks[16] ? p1Landmarks[16].y : 0;
                    }
                    if (p2Landmarks) {
                        playerState.p2.commandStartLeftWristY = p2Landmarks[15] ? p2Landmarks[15].y : 0;
                        playerState.p2.commandStartRightWristY = p2Landmarks[16] ? p2Landmarks[16].y : 0;
                    }
                }

                if (!p1Landmarks) {
                    msgP1El.style.display = 'block';
                    msgP1El.innerText = "P1 請入鏡";
                } else if (!p1InFrame) {
                    msgP1El.style.display = 'block';
                    msgP1El.innerText = "P1 請完整入鏡";
                } else {
                    msgP1El.style.display = 'none';
                }

                if (!p2Landmarks) {
                    msgP2El.style.display = 'block';
                    msgP2El.innerText = "P2 請入鏡";
                } else if (!p2InFrame) {
                    msgP2El.style.display = 'block';
                    msgP2El.innerText = "P2 請完整入鏡";
                } else {
                    msgP2El.style.display = 'none';
                }

                if (gameState === "WAITING_FOR_NEUTRAL") {
                    let p1Ready = false;
                    let p2Ready = false;

                    if (p1Landmarks && p1InFrame && CONFIG.neutralCheck(p1Landmarks)) {
                        const hipY1 = (p1Landmarks[23].y + p1Landmarks[24].y) / 2;
                        const b1 = playerState.p1.baseline;
                        if (!b1.isInitialized) {
                            b1.samples.push(hipY1);
                            if (b1.samples.length >= 12) {
                                b1.samples.sort((a, b) => a - b);
                                const mid = Math.floor(b1.samples.length / 2);
                                b1.hipY = b1.samples.length % 2 !== 0 ? b1.samples[mid] : (b1.samples[mid - 1] + b1.samples[mid]) / 2;
                                b1.isInitialized = true;
                            }
                        } else {
                            b1.hipY = b1.hipY * 0.99 + hipY1 * 0.01;
                        }
                        p1Ready = b1.isInitialized;
                    }

                    if (p2Landmarks && p2InFrame && CONFIG.neutralCheck(p2Landmarks)) {
                        const hipY2 = (p2Landmarks[23].y + p2Landmarks[24].y) / 2;
                        const b2 = playerState.p2.baseline;
                        if (!b2.isInitialized) {
                            b2.samples.push(hipY2);
                            if (b2.samples.length >= 12) {
                                b2.samples.sort((a, b) => a - b);
                                const mid = Math.floor(b2.samples.length / 2);
                                b2.hipY = b2.samples.length % 2 !== 0 ? b2.samples[mid] : (b2.samples[mid - 1] + b2.samples[mid]) / 2;
                                b2.isInitialized = true;
                            }
                        } else {
                            b2.hipY = b2.hipY * 0.99 + hipY2 * 0.01;
                        }
                        p2Ready = b2.isInitialized;
                    }

                    const everyoneReady = p1Landmarks && p2Landmarks && p1InFrame && p2InFrame && p1Ready && p2Ready;

                    if (!p1Landmarks || !p2Landmarks) {
                        commandDisplay.style.color = "var(--primary-color)";
                        commandDisplay.innerText = "等待雙人入鏡";
                    } else if (!p1Ready || !p2Ready) {
                        commandDisplay.style.color = "var(--warning-color)";
                        commandDisplay.innerText = "等待準備完成";
                    }

                    if (everyoneReady) {
                        startCountdownPhase();
                    }
                }

                if (gameState === "PLAYING" && currentCommand && !roundScored) {
                    let p1Success = false;
                    let p2Success = false;

                    if (p1Landmarks) {
                        let matched = currentCommand.check(p1Landmarks, 'p1');
                        if (matched) {
                            playerState.p1.actionConfirm++;
                        } else {
                            playerState.p1.actionConfirm = 0;
                        }
                        if (playerState.p1.actionConfirm >= CONFIG.detection.actionConfirmFrames) {
                            p1Success = true;
                            if (!playerState.p1.reactionTime) {
                                playerState.p1.reactionTime = performance.now() - commandStartTime;
                            }
                        }
                    } else {
                        playerState.p1.actionConfirm = 0;
                    }

                    if (p2Landmarks) {
                        let matched = currentCommand.check(p2Landmarks, 'p2');
                        if (matched) {
                            playerState.p2.actionConfirm++;
                        } else {
                            playerState.p2.actionConfirm = 0;
                        }
                        if (playerState.p2.actionConfirm >= CONFIG.detection.actionConfirmFrames) {
                            p2Success = true;
                            if (!playerState.p2.reactionTime) {
                                playerState.p2.reactionTime = performance.now() - commandStartTime;
                            }
                        }
                    } else {
                        playerState.p2.actionConfirm = 0;
                    }

                    if ((p1Success || p2Success) && !roundScored) {
                        roundScored = true;
                        gameState = "ROUND_END";

                        let winner = null;
                        const rt1 = playerState.p1.reactionTime || 99999;
                        const rt2 = playerState.p2.reactionTime || 99999;

                        if (p1Success && p2Success) {
                            const diff = Math.abs(rt1 - rt2);
                            if (diff < 50) {
                                winner = "DRAW";
                            } else if (rt1 < rt2) {
                                winner = "P1";
                            } else {
                                winner = "P2";
                            }
                        } else if (p1Success) {
                            winner = "P1";
                        } else if (p2Success) {
                            winner = "P2";
                        }

                        if (winner === "DRAW") {
                            commandDisplay.style.color = "var(--warning-color)";
                            commandDisplay.innerText = `平手！\nP1: ${rt1.toFixed(0)}ms / P2: ${rt2.toFixed(0)}ms`;
                        } else if (winner === "P1") {
                            scoreP1++;
                            scoreP1El.innerText = scoreP1;
                            commandDisplay.style.color = "var(--success-color)";
                            commandDisplay.innerText = `P1 得分！\n${rt1.toFixed(0)}ms`;
                        } else if (winner === "P2") {
                            scoreP2++;
                            scoreP2El.innerText = scoreP2;
                            commandDisplay.style.color = "var(--success-color)";
                            commandDisplay.innerText = `P2 得分！\n${rt2.toFixed(0)}ms`;
                        }
                        setTimeout(startNeutralCheckPhase, CONFIG.timing.roundEndDelay);
                    }
                }

                canvasCtx.restore();
            }

            if (webcamRunning) {
                requestAnimationFrame(predictWebcam);
            }
        }
    </script>
</body>
