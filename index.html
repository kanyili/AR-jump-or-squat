<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>雙人 AR 反應速度遊戲</title>
    <style>
        /* 集中管理樣式變數：在此處調整配色與視覺主題 */
        :root {
            --bg-color: #0b0f19;          /* 背景主色 */
            --primary-color: #00f3ff;     /* 主要科技藍色 */
            --success-color: #00ffcc;     /* 成功/得分顏色 */
            --danger-color: #ff0055;      /* 錯誤/指令警示顏色 */
            --warning-color: #ffaa00;     /* 準備階段黃色 */
            --text-color: #ffffff;        /* 文字預設白色 */
            --hud-bg: rgba(11, 15, 25, 0.4); /* 中央控制區透明背景 */
            --border-glow: rgba(0, 243, 255, 0.2); /* 邊框光暈顏色 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* 螢幕直向警告畫面 */
        #rotate-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(11, 15, 25, 0.95);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #rotate-warning .icon {
            font-size: 48px;
            margin-bottom: 20px;
            animation: rotatePhone 2s infinite ease-in-out;
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        @media screen and (orientation: portrait) {
            #rotate-warning {
                display: flex;
            }
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* 視訊鏡頭畫面（水平鏡射） */
        #webcam-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
        }

        /* 骨架繪製畫布 */
        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            transform: scaleX(-1);
        }

        /* 遊戲 UI 介面層 */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: flex;
            flex-direction: row;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        /* 玩家操作區域（可在此調整左右兩側的大小與邊框） */
        .player-zone {
            width: 45%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 20px;
            position: relative;
            border: 2px dashed var(--border-glow);
        }

        #zone-p1 { border-right: none; }
        #zone-p2 { border-left: none; }

        /* 中央指令與狀態區 */
        .center-hud {
            width: 10%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--hud-bg);
            backdrop-filter: blur(4px);
            border-left: 1px solid var(--border-glow);
            border-right: 1px solid var(--border-glow);
        }

        .player-header {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            margin-bottom: 10px;
        }

        .player-score {
            font-size: 3rem;
            font-weight: 900;
            color: var(--text-color);
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
            margin-bottom: 15px;
        }

        .player-status-msg {
            background: rgba(255, 77, 77, 0.8);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.5);
            display: none;
        }

        /* 中央提示詞字體大小與樣式 */
        #command-display {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--primary-color);
            text-shadow: 0 0 20px var(--primary-color);
            text-align: center;
            line-height: 1.4;
        }

        /* 開始遊戲覆蓋層 */
        #overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: rgba(11, 15, 25, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .game-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--primary-color);
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), #0066ff);
            color: var(--text-color);
            border: none;
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }
        
        .btn-primary:disabled {
            background: #2a3b4c;
            color: #ff8080;
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div id="rotate-warning">
        <div class="icon">📱</div>
        <h2>請將手機轉為橫向</h2>
        <p>本遊戲需使用橫向畫面進行雙人 AR 互動</p>
    </div>

    <div id="game-container">
        <video id="webcam-video" autoplay playsinline muted></video>
        <canvas id="game-canvas"></canvas>

        <div id="ui-layer">
            <div class="player-zone" id="zone-p1">
                <div class="player-header">PLAYER 1</div>
                <div class="player-score" id="score-p1">0</div>
                <div class="player-status-msg" id="msg-p1">請完整入鏡</div>
            </div>

            <div class="center-hud">
                <div id="command-display">請站好</div>
            </div>

            <div class="player-zone" id="zone-p2">
                <div class="player-header">PLAYER 2</div>
                <div class="player-score" id="score-p2">0</div>
                <div class="player-status-msg" id="msg-p2">請完整入鏡</div>
            </div>
        </div>

        <div id="overlay-screen" class="interactive">
            <h1 class="game-title">雙人 AR 反應速度遊戲</h1>
            <button class="btn-primary" id="start-btn" disabled>正在初始化模組...</button>
        </div>
    </div>

    <script type="module">
        import { PoseLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/vision_bundle.mjs";

        // ==========================================
        // 集中設定檔 (Game Configuration)
        // 集中管理參數、可見度門檻與動作判定
        // ==========================================
        const CONFIG = {
            // 1. 時間間隔設定 (毫秒)
            timing: {
                countdownDelay: 1500, // 「準備...」到出題的等待時間
                roundEndDelay: 2000   // 分出勝負後、進入下一局前的暫停時間
            },
            
            // 2. 畫面範圍與信心分數門檻設定
            detection: {
                splitScreenX: 0.5,         // 左右玩家分界線 (0.5 代表畫面正中央)
                neutralCrouchMax: 0.60,    // 中立站姿時，髖部的最高位置界線
                visibilityThreshold: 0.6,  // 動作判定的關節可見度信心門檻
                squatKneeAngleMax: 145,    // 膝蓋彎曲角度門檻 (小於此角度代表膝蓋有彎曲)
                squatHipKneeRatioMax: 0.42 // 髖膝距離相對於腿長的比例門檻
            },
            
            // 3. 偵測動作的新增定義區 (加入相對比例、膝蓋夾角與動態下降檢查)
            commands: [
                { 
                    text: "舉左手", 
                    check: (l) => {
                        const t = CONFIG.detection.visibilityThreshold;
                        if ((l[15].visibility ?? 0) < t || (l[11].visibility ?? 0) < t) return false;
                        return l[15].y < l[11].y; 
                    } 
                },
                { 
                    text: "舉右手", 
                    check: (l) => {
                        const t = CONFIG.detection.visibilityThreshold;
                        if ((l[16].visibility ?? 0) < t || (l[12].visibility ?? 0) < t) return false;
                        return l[16].y < l[12].y; 
                    } 
                },
                { 
                    text: "蹲下",   
                    check: (l, playerKey = 'p1') => {
                        const t = CONFIG.detection.visibilityThreshold;

                        // 嚴格檢查重要關節 visibility (使用 ?? 0 避免缺漏視為 1)
                        if (
                            (l[23].visibility ?? 0) < t || (l[24].visibility ?? 0) < t || // 髖部
                            (l[25].visibility ?? 0) < t || (l[26].visibility ?? 0) < t || // 膝蓋
                            (l[27].visibility ?? 0) < t || (l[28].visibility ?? 0) < t    // 腳踝
                        ) {
                            return false;
                        }

                        const avgHipY = (l[23].y + l[24].y) / 2;
                        const avgKneeY = (l[25].y + l[26].y) / 2;
                        const avgAnkleY = (l[27].y + l[28].y) / 2;

                        // 計算相對幾何比例與高度
                        const legLength = avgAnkleY - avgHipY;
                        const hipKneeSpan = avgKneeY - avgHipY;

                        if (legLength <= 0) return false;

                        // 1. 髖膝比例判定 (髖部是否接近膝蓋)
                        const hipKneeRatio = hipKneeSpan / legLength;
                        const isHipNearKnee = hipKneeRatio < CONFIG.detection.squatHipKneeRatioMax;

                        // 2. 計算膝蓋彎曲角度 (Hip -> Knee -> Ankle)
                        const getAngle = (a, b, c) => {
                            const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
                            let angle = Math.abs(radians * 180.0 / Math.PI);
                            if (angle > 180.0) angle = 360.0 - angle;
                            return angle;
                        };

                        const leftKneeAngle = getAngle(l[23], l[25], l[27]);
                        const rightKneeAngle = getAngle(l[24], l[26], l[28]);
                        const avgKneeAngle = (leftKneeAngle + rightKneeAngle) / 2;
                        const isKneeBent = avgKneeAngle < CONFIG.detection.squatKneeAngleMax;

                        // 3. 動態下降檢查 (確認髖部確實正在向下移動或維持在低點)
                        let isMovingDown = true;
                        if (playerKey) {
                            const history = squatHistory[playerKey];
                            if (history.length > 0) {
                                const prevAvgY = history[history.length - 1];
                                // 當前 Y 大於或等於前幾幀平均，代表正在下降或處於低位
                                isMovingDown = avgHipY >= (prevAvgY - 0.01);
                            }
                            history.push(avgHipY);
                            if (history.length > 6) history.shift();
                        }

                        return isHipNearKnee && isKneeBent && isMovingDown;
                    } 
                }
            ],
            
            // 4. 中立姿勢與全身入鏡檢查邏輯
            neutralCheck: function(l) {
                const t = 0.55; 
                const isFullyVisible = 
                    (l[11].visibility ?? 0) > t && (l[12].visibility ?? 0) > t && 
                    (l[15].visibility ?? 0) > t && (l[16].visibility ?? 0) > t && 
                    (l[23].visibility ?? 0) > t && (l[24].visibility ?? 0) > t && 
                    (l[25].visibility ?? 0) > t && (l[26].visibility ?? 0) > t && 
                    (l[27].visibility ?? 0) > t && (l[28].visibility ?? 0) > t;   

                if (!isFullyVisible) return false;

                const leftHandDown = l[15].y > l[11].y; 
                const rightHandDown = l[16].y > l[12].y; 
                const notCrouching = (l[23].y + l[24].y) / 2 < this.detection.neutralCrouchMax; 
                
                return leftHandDown && rightHandDown && notCrouching;
            },

            // 5. 快速完整入鏡檢查
            isBodyInFrame: function(l) {
                if (!l) return false;
                const t = 0.4; 
                return (l[11].visibility ?? 0) > t && (l[12].visibility ?? 0) > t &&
                       (l[23].visibility ?? 0) > t && (l[24].visibility ?? 0) > t &&
                       (l[25].visibility ?? 0) > t && (l[26].visibility ?? 0) > t &&
                       (l[27].visibility ?? 0) > t && (l[28].visibility ?? 0) > t;
            }
        };

        // P1 / P2 獨立歷史紀錄緩衝區 (用於動態下降輔助判定)
        const squatHistory = {
            p1: [],
            p2: []
        };

        let poseLandmarker = undefined;
        let webcamRunning = false;
        let lastVideoTime = -1;

        let scoreP1 = 0;
        let scoreP2 = 0;
        let gameState = "IDLE"; 
        let currentCommand = null; 

        const startBtn = document.getElementById('start-btn');
        const overlayScreen = document.getElementById('overlay-screen');
        const webcamVideo = document.getElementById('webcam-video');
        const canvasElement = document.getElementById('game-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const drawingUtils = new DrawingUtils(canvasCtx);

        const commandDisplay = document.getElementById('command-display');
        const scoreP1El = document.getElementById('score-p1');
        const scoreP2El = document.getElementById('score-p2');
        const msgP1El = document.getElementById('msg-p1');
        const msgP2El = document.getElementById('msg-p2');

        async function preloadModel() {
            try {
                startBtn.innerText = "正在載入 WASM...";
                const visionFilesetResolver = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/wasm"
                );
                startBtn.innerText = "正在載入 AI 模型...";
                poseLandmarker = await PoseLandmarker.createFromOptions(visionFilesetResolver, {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numPoses: 2
                });
                startBtn.disabled = false;
                startBtn.innerText = "開始遊戲";
            } catch (err) {
                startBtn.innerText = "錯誤: " + err.message;
            }
        }

        preloadModel();

        startBtn.addEventListener('click', async () => {
            if (!poseLandmarker) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                webcamVideo.srcObject = stream;
                webcamVideo.addEventListener('loadeddata', () => {
                    webcamRunning = true;
                    overlayScreen.style.opacity = '0';
                    setTimeout(() => overlayScreen.style.display = 'none', 300);
                    requestAnimationFrame(predictWebcam);
                    startNeutralCheckPhase(); 
                });
            } catch (err) {
                alert('無法啟用攝影機');
            }
        });

        function startNeutralCheckPhase() {
            gameState = "WAITING_FOR_NEUTRAL";
            currentCommand = null;
            // 清空歷史紀錄以防殘留狀態影響下一局
            squatHistory.p1 = [];
            squatHistory.p2 = [];
            commandDisplay.style.color = "var(--primary-color)";
            commandDisplay.innerText = "請雙手放下\n維持站好";
        }

        function startCountdownPhase() {
            gameState = "COUNTDOWN";
            squatHistory.p1 = [];
            squatHistory.p2 = [];
            commandDisplay.style.color = "var(--warning-color)";
            commandDisplay.innerText = "準備...";
            
            setTimeout(() => {
                if (!webcamRunning) return;
                const randomCmd = CONFIG.commands[Math.floor(Math.random() * CONFIG.commands.length)];
                currentCommand = randomCmd;
                gameState = "PLAYING"; 
                commandDisplay.style.color = "var(--danger-color)";
                commandDisplay.innerText = randomCmd.text;
            }, CONFIG.timing.countdownDelay);
        }

        async function predictWebcam() {
            if (canvasElement.width !== webcamVideo.videoWidth || canvasElement.height !== webcamVideo.videoHeight) {
                canvasElement.width = webcamVideo.videoWidth;
                canvasElement.height = webcamVideo.videoHeight;
            }

            let startTimeMs = performance.now();
            if (lastVideoTime !== webcamVideo.currentTime) {
                lastVideoTime = webcamVideo.currentTime;
                const poseResult = poseLandmarker.detectForVideo(webcamVideo, startTimeMs);

                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

                let p1Landmarks = null;
                let p2Landmarks = null;

                if (poseResult.landmarks && poseResult.landmarks.length > 0) {
                    for (const landmarks of poseResult.landmarks) {
                        const hipX = (landmarks[23].x + landmarks[24].x) / 2;
                        if (hipX > CONFIG.detection.splitScreenX) {
                            p1Landmarks = landmarks; 
                        } else {
                            p2Landmarks = landmarks; 
                        }

                        drawingUtils.drawConnectors(landmarks, PoseLandmarker.POSE_CONNECTIONS, { color: '#00F3FF', lineWidth: 3 });
                        drawingUtils.drawLandmarks(landmarks, { color: '#FF0055', radius: 4 });
                    }
                }

                if (p1Landmarks && CONFIG.isBodyInFrame(p1Landmarks)) {
                    msgP1El.style.display = 'none';
                } else {
                    msgP1El.style.display = 'block';
                    msgP1El.innerText = p1Landmarks ? "請完整入鏡 (露出全身)" : "請入鏡";
                }

                if (p2Landmarks && CONFIG.isBodyInFrame(p2Landmarks)) {
                    msgP2El.style.display = 'none';
                } else {
                    msgP2El.style.display = 'block';
                    msgP2El.innerText = p2Landmarks ? "請完整入鏡 (露出全身)" : "請入鏡";
                }

                if (gameState === "WAITING_FOR_NEUTRAL") {
                    let p1Ready = p1Landmarks ? CONFIG.neutralCheck(p1Landmarks) : false;
                    let p2Ready = p2Landmarks ? CONFIG.neutralCheck(p2Landmarks) : false;

                    let everyoneReady = false;
                    if (p1Landmarks && p2Landmarks) {
                        everyoneReady = p1Ready && p2Ready; 
                    } else if (p1Landmarks || p2Landmarks) {
                        everyoneReady = p1Ready || p2Ready; 
                    }

                    if (everyoneReady) {
                        startCountdownPhase(); 
                    }
                }

                if (gameState === "PLAYING" && currentCommand) {
                    // 根據指令文字判斷是否需要傳入玩家代號以讀取獨立歷史紀錄
                    let p1Success = p1Landmarks ? (currentCommand.text === "蹲下" ? currentCommand.check(p1Landmarks, 'p1') : currentCommand.check(p1Landmarks)) : false;
                    let p2Success = p2Landmarks ? (currentCommand.text === "蹲下" ? currentCommand.check(p2Landmarks, 'p2') : currentCommand.check(p2Landmarks)) : false;

                    if (p1Success || p2Success) {
                        gameState = "ROUND_END"; 
                        if (p1Success) {
                            scoreP1++;
                            scoreP1El.innerText = scoreP1;
                            commandDisplay.style.color = "var(--success-color)";
                            commandDisplay.innerText = "P1 得分！";
                        } else if (p2Success) {
                            scoreP2++;
                            scoreP2El.innerText = scoreP2;
                            commandDisplay.style.color = "var(--success-color)";
                            commandDisplay.innerText = "P2 得分！";
                        }
                        setTimeout(startNeutralCheckPhase, CONFIG.timing.roundEndDelay);
                    }
                }

                canvasCtx.restore();
            }

            if (webcamRunning) {
                requestAnimationFrame(predictWebcam);
            }
        }
    </script>
</body>
</html>
