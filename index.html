<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>雙人 AR 反應速度遊戲 - Pose Prototype</title>
    <!-- 引入 MediaPipe Tasks Vision 函式庫 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.js" crossorigin="anonymous"></script>
    <style>
        /* === 1. 基礎設定與重置 === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
            color: #ffffff;
        }

        /* === 2. 橫向強制提示遮罩 (直向時顯示) === */
        #rotate-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(11, 15, 25, 0.95);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #rotate-warning .icon {
            font-size: 48px;
            margin-bottom: 20px;
            animation: rotatePhone 2s infinite ease-in-out;
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        @media screen and (orientation: portrait) {
            #rotate-warning {
                display: flex;
            }
        }

        /* === 3. 遊戲主容器與三層架構 (Z-index Layering) === */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Layer 1: 最底層 - 攝影機背景 */
        #webcam-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* 前鏡頭水平鏡像翻轉 */
            z-index: 1;
        }

        /* Layer 2: 中間層 - Canvas 骨架與特效繪製 */
        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            transform: scaleX(-1); /* 配合影片鏡像，將骨架座標一同翻轉對齊 */
        }

        /* Layer 3: 最上層 - 介面 HUD */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: flex;
            flex-direction: row;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        /* === 4. 版面配置：左右 45% 與中間 10% === */
        .player-zone {
            width: 45%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 20px;
            position: relative;
            border: 2px dashed rgba(0, 243, 255, 0.2);
        }

        #zone-p1 { border-right: none; }
        #zone-p2 { border-left: none; }

        .center-hud {
            width: 10%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(11, 15, 25, 0.4);
            backdrop-filter: blur(4px);
            border-left: 1px solid rgba(0, 243, 255, 0.2);
            border-right: 1px solid rgba(0, 243, 255, 0.2);
        }

        /* === 5. UI 元件樣式 === */
        .player-header {
            font-size: 1.2rem;
            font-weight: bold;
            color: #00f3ff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            margin-bottom: 10px;
        }

        .player-score {
            font-size: 3rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
            margin-bottom: 15px;
        }

        .player-status-msg {
            background: rgba(255, 77, 77, 0.8);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.5);
            display: none;
        }

        #command-display {
            font-size: 2.5rem;
            font-weight: 900;
            color: #00f3ff;
            text-shadow: 0 0 20px #00f3ff;
            text-align: center;
        }

        #overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: rgba(11, 15, 25, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease;
        }

        .game-title {
            font-size: 2.5rem;
            font-weight: 900;
            color: #00f3ff;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00f3ff, #0066ff);
            color: #ffffff;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }
    </style>
</head>
<body>

    <!-- 1. 橫向轉動提示 -->
    <div id="rotate-warning">
        <div class="icon">📱</div>
        <h2>請將手機轉為橫向</h2>
        <p>本遊戲需使用橫向畫面進行雙人 AR 互動</p>
    </div>

    <!-- 2. 遊戲主畫面 -->
    <div id="game-container">
        <!-- Layer 1: 攝影機背景 -->
        <video id="webcam-video" autoplay playsinline muted></video>

        <!-- Layer 2: 骨架畫布 -->
        <canvas id="game-canvas"></canvas>

        <!-- Layer 3: 介面 HUD -->
        <div id="ui-layer">
            <div class="player-zone" id="zone-p1">
                <div class="player-header">PLAYER 1</div>
                <div class="player-score" id="score-p1">0</div>
                <div class="player-status-msg" id="msg-p1">請讓雙腳入鏡</div>
            </div>

            <div class="center-hud">
                <div id="command-display">載入AI中</div>
            </div>

            <div class="player-zone" id="zone-p2">
                <div class="player-header">PLAYER 2</div>
                <div class="player-score" id="score-p2">0</div>
                <div class="player-status-msg" id="msg-p2">請讓雙腳入鏡</div>
            </div>
        </div>

        <!-- 遊戲開始覆蓋選單 -->
        <div id="overlay-screen" class="interactive">
            <h1 class="game-title">雙人 AR 反應速度遊戲</h1>
            <button class="btn-primary" id="start-btn" disabled>正在載入 AI 模型...</button>
        </div>
    </div>

    <!-- AI 模型初始化與辨識邏輯 -->
    <script>
        const { PoseLandmarker, FilesetResolver, DrawingUtils } = vision;

        let poseLandmarker = undefined;
        let webcamRunning = false;
        let lastVideoTime = -1;

        const startBtn = document.getElementById('start-btn');
        const overlayScreen = document.getElementById('overlay-screen');
        const webcamVideo = document.getElementById('webcam-video');
        const canvasElement = document.getElementById('game-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const commandDisplay = document.getElementById('command-display');

        const drawingUtils = new DrawingUtils(canvasCtx);

        // 1. 初始化 MediaPipe Pose Landmarker 模型
        async function createPoseLandmarker() {
            try {
                const visionFilesetResolver = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
                );
                poseLandmarker = await PoseLandmarker.createFromOptions(visionFilesetResolver, {
                    baseOptions: {
                        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task`,
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numPoses: 2 // 支援同時追蹤兩個人
                });
                
                startBtn.disabled = false;
                startBtn.innerText = "開始遊戲";
                commandDisplay.innerText = "READY";
                console.log("MediaPipe 模型載入完成！");
            } catch (err) {
                console.error("AI 模型載入失敗:", err);
                commandDisplay.innerText = "載入失敗";
                startBtn.innerText = "載入失敗，請重新整理";
            }
        }

        createPoseLandmarker();

        // 2. 點擊開始按鈕
        startBtn.addEventListener('click', async () => {
            if (!poseLandmarker) return;

            try {
                const constraints = {
                    video: {
                        facingMode: 'user',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                webcamVideo.srcObject = stream;
                
                webcamVideo.addEventListener('loadeddata', () => {
                    webcamRunning = true;
                    overlayScreen.style.opacity = '0';
                    setTimeout(() => {
                        overlayScreen.style.display = 'none';
                    }, 300);

                    // 開始進行每秒影格辨識與繪製
                    requestAnimationFrame(predictWebcam);
                });

            } catch (err) {
                console.error('無法存取攝影機:', err);
                alert('無法啟用攝影機，請檢查 Safari 權限設定。');
            }
        });

        // 3. 即時循環辨識迴圈
        async function predictWebcam() {
            // 設定 Canvas 尺寸與 Video 一致
            if (canvasElement.width !== webcamVideo.videoWidth || canvasElement.height !== webcamVideo.videoHeight) {
                canvasElement.width = webcamVideo.videoWidth;
                canvasElement.height = webcamVideo.videoHeight;
            }

            let startTimeMs = performance.now();
            if (lastVideoTime !== webcamVideo.currentTime) {
                lastVideoTime = webcamVideo.currentTime;
                
                // 執行 AI 辨識
                const poseResult = poseLandmarker.detectForVideo(webcamVideo, startTimeMs);

                // 清除上一幀的畫布
                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

                if (poseResult.landmarks) {
                    // 迴圈繪製每一個被偵測到的人的骨架
                    for (const landmarks of poseResult.landmarks) {
                        // 繪製關節點與連線
                        drawingUtils.drawConnectors(landmarks, PoseLandmarker.POSE_CONNECTIONS, {
                            color: '#00F3FF',
                            lineWidth: 3
                        });
                        drawingUtils.drawLandmarks(landmarks, {
                            color: '#FF0055',
                            radius: 4
                        });
                    }
                }
                canvasCtx.restore();
            }

            if (webcamRunning) {
                requestAnimationFrame(predictWebcam);
            }
        }
    </script>
</body>
</html>
